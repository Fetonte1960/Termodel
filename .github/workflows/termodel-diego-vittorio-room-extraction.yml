name: Termodel Diego_Vittorio Room Extraction

permissions:
  contents: read
  statuses: write

concurrency:
  group: termodel-diego-vittorio-room-extraction
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/termodel-diego-vittorio-room-extraction.yml'

jobs:
  extract:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Termodel job RUNNING
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "pending"
            context = "Termodel/job"
            description = "RUNNING - Room Extraction #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build Harness + Core
        shell: pwsh
        run: |
          dotnet restore tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj --nologo --verbosity:quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-restore --nologo --verbosity:minimal -p:BuildInParallel=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare real public panels project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioRoomExtraction"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $project = "..\..\docs\termodel-ui-demo\examples\pannelli-radianti.tmdl.txt"
          $full = Join-Path $root "pannelli-radianti.full.xml"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- prepare --project $project --output $full
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $full)) {
            throw "Preparazione progetto pubblico pannelli non riuscita."
          }
          Write-Host "PUBLIC_PANELS_PREPARE_OK"
          Write-Host ("FULL_INPUT_SHA256=" + (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash)

      - name: Split locales and classify geometry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioRoomExtraction"
          $full = Join-Path $root "pannelli-radianti.full.xml"
          [xml]$doc = Get-Content -LiteralPath $full -Raw
          $localeDir = Join-Path $root "locales"
          New-Item -ItemType Directory -Path $localeDir -Force | Out-Null

          function ToDouble([string]$v) {
            return [double]::Parse($v,[Globalization.CultureInfo]::InvariantCulture)
          }

          function SamePoint($a,$b,[double]$tol=0.001) {
            return ([Math]::Abs($a.X-$b.X) -lt $tol -and [Math]::Abs($a.Y-$b.Y) -lt $tol)
          }

          function Raw-Vertices($locale) {
            return @($locale.PerimetroInterno.Punto | ForEach-Object {
              [pscustomobject]@{ X = ToDouble ([string]$_.X); Y = ToDouble ([string]$_.Y) }
            })
          }

          function Engine-Normalize($locale) {
            $pts=@(Raw-Vertices $locale | ForEach-Object {
              [pscustomobject]@{ X=[Math]::Round($_.X,2); Y=[Math]::Round($_.Y,2) }
            })
            if ($pts.Count -gt 1 -and (SamePoint $pts[0] $pts[-1])) {
              $pts=@($pts[0..($pts.Count-2)])
            }
            $changed=$true
            while($changed -and $pts.Count -gt 3) {
              $changed=$false
              $next=@()
              for($i=0;$i -lt $pts.Count;$i++) {
                $a=$pts[($i-1+$pts.Count)%$pts.Count]
                $b=$pts[$i]
                $d=$pts[($i+1)%$pts.Count]
                $cross=($b.X-$a.X)*($d.Y-$b.Y)-($b.Y-$a.Y)*($d.X-$b.X)
                if ([Math]::Abs($cross) -le 0.000001) { $changed=$true; continue }
                $next += $b
              }
              if ($next.Count -lt 3) { break }
              $pts=@($next)
            }
            return @($pts)
          }

          function Is-Rectangle($pts) {
            if ($pts.Count -ne 4) { return $false }
            $xs=@($pts | ForEach-Object { [Math]::Round($_.X,6) } | Sort-Object -Unique)
            $ys=@($pts | ForEach-Object { [Math]::Round($_.Y,6) } | Sort-Object -Unique)
            if ($xs.Count -ne 2 -or $ys.Count -ne 2) { return $false }
            for($i=0;$i -lt 4;$i++) {
              $a=$pts[$i]; $b=$pts[($i+1)%4]
              $dx=[Math]::Abs($a.X-$b.X); $dy=[Math]::Abs($a.Y-$b.Y)
              if ($dx -gt 0.001 -and $dy -gt 0.001) { return $false }
            }
            return $true
          }

          function Point-InPolygon($point,$poly) {
            $inside=$false
            $j=$poly.Count-1
            for($i=0;$i -lt $poly.Count;$i++) {
              $pi=$poly[$i]; $pj=$poly[$j]
              if ((($pi.Y -gt $point.Y) -ne ($pj.Y -gt $point.Y))) {
                $xCross=($pj.X-$pi.X)*($point.Y-$pi.Y)/($pj.Y-$pi.Y)+$pi.X
                if ($point.X -lt $xCross) { $inside = -not $inside }
              }
              $j=$i
            }
            return $inside
          }

          $allLines=@($doc.Locali.Piano.Tubi.Linea | ForEach-Object {
            [pscustomobject]@{
              Id=[string]$_.Id
              P0=[pscustomobject]@{X=ToDouble([string]$_.P0.X);Y=ToDouble([string]$_.P0.Y)}
              P1=[pscustomobject]@{X=ToDouble([string]$_.P1.X);Y=ToDouble([string]$_.P1.Y)}
            }
          })

          function Candidate-Inlet($pts) {
            foreach($line in $allLines) {
              $p0In=Point-InPolygon $line.P0 $pts
              $p1In=Point-InPolygon $line.P1 $pts
              if ($p0In -eq $p1In) { continue }
              $insidePoint=if($p0In){$line.P0}else{$line.P1}
              $shared=$false
              foreach($other in $allLines) {
                if($other.Id -eq $line.Id){continue}
                if((SamePoint $insidePoint $other.P0) -or (SamePoint $insidePoint $other.P1)) {
                  $shared=$true; break
                }
              }
              if(-not $shared){ return $line.Id }
            }
            return ""
          }

          $summary=@()
          foreach($locale in @($doc.Locali.Locale)) {
            $id=[string]$locale.Id
            $raw=@(Raw-Vertices $locale)
            if($raw.Count -gt 1 -and (SamePoint $raw[0] $raw[-1])) {$raw=@($raw[0..($raw.Count-2)])}
            $pts=@(Engine-Normalize $locale)
            $minX=($pts | Measure-Object X -Minimum).Minimum
            $maxX=($pts | Measure-Object X -Maximum).Maximum
            $minY=($pts | Measure-Object Y -Minimum).Minimum
            $maxY=($pts | Measure-Object Y -Maximum).Maximum
            $rect=Is-Rectangle $pts
            $inlet=Candidate-Inlet $pts

            $single = New-Object System.Xml.XmlDocument
            $rootNode = $single.CreateElement("Locali")
            $rootNode.SetAttribute("Versione","1.0")
            [void]$single.AppendChild($rootNode)
            [void]$rootNode.AppendChild($single.ImportNode($doc.Locali.Piano,$true))
            [void]$rootNode.AppendChild($single.ImportNode($locale,$true))

            $file = Join-Path $localeDir ($id + ".xml")
            $settings = New-Object System.Xml.XmlWriterSettings
            $settings.Indent = $false
            $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
            $writer=[System.Xml.XmlWriter]::Create($file,$settings)
            try { $single.Save($writer) } finally { $writer.Dispose() }

            $summary += [pscustomobject]@{
              id=$id
              rawVertexCount=$raw.Count
              normalizedVertexCount=$pts.Count
              rectangle=$rect
              panelCandidate=(-not [string]::IsNullOrWhiteSpace($inlet))
              inletLine=$inlet
              minX=[Math]::Round($minX,5)
              minY=[Math]::Round($minY,5)
              maxX=[Math]::Round($maxX,5)
              maxY=[Math]::Round($maxY,5)
              width=[Math]::Round($maxX-$minX,5)
              height=[Math]::Round($maxY-$minY,5)
              inputSha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root "locales-summary.json") -Encoding utf8NoBOM
          $summary | Sort-Object @{Expression="rectangle";Descending=$true}, @{Expression="panelCandidate";Descending=$true}, id | Format-Table -AutoSize
          $target=@($summary | Where-Object { $_.rectangle -and $_.panelCandidate })
          Write-Host "ROOM_SPLIT_OK locales=$($summary.Count) panelLocales=$(@($summary|Where-Object panelCandidate).Count) rectangularPanelLocales=$($target.Count)"
          Write-Host ("RECTANGULAR_PANEL_IDS="+(($target.id)-join ","))
      - name: Run each rectangular panel locale on Diego_Vittorio
        shell: pwsh
        env:
          TERMODEL_DIEGO_VITTORIO_TRACE_RETURN: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioRoomExtraction"
          $summary = Get-Content -LiteralPath (Join-Path $root "locales-summary.json") -Raw | ConvertFrom-Json
          $outRoot = Join-Path $root "runs"
          New-Item -ItemType Directory -Path $outRoot -Force | Out-Null
          foreach($room in @($summary | Where-Object { $_.rectangle -and $_.panelCandidate })) {
            $id=[string]$room.id
            $input=Join-Path $root ("locales\"+$id+".xml")
            $out=Join-Path $outRoot $id
            dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run --input $input --engine Diego_Vittorio --id $id --p 0.30 --out $out
            if ($LASTEXITCODE -ne 0) { throw "Harness fallito per $id" }
            Write-Host "RECT_ROOM_RUN_OK id=$id inlet=$($room.inletLine)"
            Get-Content -LiteralPath (Join-Path $out ($id+".log.txt")) | Where-Object {
              $_ -match 'Linea ingresso|Punto interno|Ritorno: offset|Ritorno parametrico|Ritorno autonomo|Chiusura rapida|Chiusura:'
            } | ForEach-Object { Write-Host ("ROOM_DIAG "+$id+" "+$_) }
          }

      - name: Diagnose locale_1 with opposite Return side
        shell: pwsh
        env:
          TERMODEL_DIEGO_VITTORIO_TRACE_RETURN: "true"
          TERMODEL_DIEGO_VITTORIO_RETURN_SIDE: "right"
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioRoomExtraction"
          $input = Join-Path $root "locales\locale_1.xml"
          $out = Join-Path $root "diagnostics-right\locale_1"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run --input $input --engine Diego_Vittorio --id locale_1_RIGHT --p 0.30 --out $out
          if ($LASTEXITCODE -ne 0) { throw "Diagnostica lato destro fallita per locale_1." }
          $log = Join-Path $out "locale_1_RIGHT.log.txt"
          Write-Host "LOCALE1_RIGHT_DIAGNOSTIC_OK"
          Get-Content -LiteralPath $log | Where-Object {
            $_ -match 'Linea ingresso|Punto interno|Ritorno: offset|Ritorno parametrico|Ritorno autonomo|Chiusura rapida|Chiusura:'
          } | ForEach-Object { Write-Host ("ROOM_RIGHT_DIAG "+$_) }

      - name: Upload room extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diego-vittorio-room-extraction
          path: ${{ runner.temp }}/DiegoVittorioRoomExtraction
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status and notify
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.TERMODEL_NTFY_TOPIC }}
        run: |
          $ok = "${{ job.status }}" -eq "success"
          $state = if ($ok) { "success" } else { "failure" }
          $label = if ($ok) { "SUCCESS" } else { "FAILED" }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "Termodel/job"
            description = "$label - Room Extraction #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($env:NTFY_TOPIC)) {
            try {
              Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Headers @{
                "Title" = "Termodel Room Extraction"
                "Priority" = "low"
                "Tags" = if ($ok) { "white_check_mark" } else { "x" }
              } -Body "Room Extraction #${{ github.run_number }} $label - $runUrl" | Out-Null
            } catch {
              Write-Warning "Notifica ntfy non riuscita: $($_.Exception.Message)"
            }
          }
