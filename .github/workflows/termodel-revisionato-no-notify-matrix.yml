name: Termodel Revisionato No Notify Matrix

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/termodel-revisionato-no-notify-matrix.yml'

jobs:
  matrix:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: |
          dotnet restore tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj --nologo --verbosity:quiet
          dotnet build tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-restore --nologo --verbosity:minimal -p:BuildInParallel=true

      - name: Public pipeline matrix
        shell: pwsh
        env:
          TERMODEL_DIEGO_VITTORIO_TRACE_CLOSURE: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $project = "tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj"
          $cases = @(
            @{ Id="square-4x4"; Input="tests/fixtures/StrategiaDiegoSquare4x4.locale.xml" },
            @{ Id="concave-l"; Input="tests/fixtures/StrategiaDiegoConcaveL.locale.xml" },
            @{ Id="oblique-trapezoid"; Input="tests/fixtures/StrategiaDiegoObliqueTrapezoid.locale.xml" },
            @{ Id="connection-terminal"; Input="tests/fixtures/StrategiaDiegoConnectionTerminal.locale.xml" },
            @{ Id="current-apartment"; Input="tests/radiant-harness/prepared/StrategiaDiegoCurrentApartment.pannelli.xml" },
            @{ Id="public-radiant-panels"; Input="tests/radiant-harness/prepared/PannelliRadiantiPublic.pannelli.xml" }
          )
          $closed = 0
          $open = 0
          foreach ($case in $cases) {
            $out = Join-Path $env:RUNNER_TEMP ("VrevMatrix-" + $case.Id)
            $runId = "VREV-MATRIX-" + $case.Id
            dotnet run --project $project -c Release --no-build -- run `
              --input $case.Input `
              --engine Vittorio_revisionato `
              --revisionato-public `
              --id $runId `
              --out $out
            if ($LASTEXITCODE -ne 0) {
              throw "Caso $($case.Id) fallito."
            }
            $logPath = Join-Path $out "$runId.log.txt"
            $log = Get-Content -LiteralPath $logPath -Raw
            if ($log -notmatch 'VREV_RETURN_PARALLEL_DIEGO') {
              throw "Caso $($case.Id): marker Return parallelo assente."
            }
            if ($log -match 'ERRORE:') {
              throw "Caso $($case.Id): errore runtime."
            }
            $returnMarker = (($log -split "\r?\n") | Where-Object { $_ -match 'VREV_RETURN_PARALLEL_DIEGO' } | Select-Object -First 1)
            if ($log -match 'Chiusura Diego combinatoria: APPLICATA') {
              $closed++
              if ($log -notmatch 'VREV_LG051_CLOSURE_OK') {
                throw "Caso $($case.Id): chiusura applicata senza raccordatura finale confermata."
              }
              Write-Host "VREV_MATRIX_CASE_OK id=$($case.Id) closure=closed $returnMarker"
            }
            elseif ($log -match 'Chiusura Diego combinatoria: NON APPLICATA') {
              $open++
              Write-Host "VREV_MATRIX_CASE_OK id=$($case.Id) closure=open $returnMarker"
            }
            else {
              throw "Caso $($case.Id): stato chiusura non riconosciuto."
            }
          }
          Write-Host "VREV_PUBLIC_MATRIX_OK cases=$($cases.Count) closed=$closed open=$open"
