name: TermodelService Build

# IMPORTANTE: protocollo stato/notifica canonico:
# .github/TERMODEL-ACTION-NOTIFICATIONS.md

permissions:
  contents: read
  statuses: write
concurrency:
  group: termodel-service-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/**'
      - 'docs/termodel-ui-demo/**'
      - '.github/workflows/termodel-service-build.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/**'
      - 'docs/termodel-ui-demo/**'
      - '.github/workflows/termodel-service-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Termodel job RUNNING
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "pending"
            context = "Termodel/job"
            description = "RUNNING - TermodelService Build #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          Write-Host "TERMODEL_JOB_STATUS=RUNNING"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Termodel.WebService.sln

      - name: Check frontend JavaScript syntax
        run: node --check ..\..\docs\termodel-ui-demo\app.js

      - name: Check radiant executive auto-load wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appPath = "..\..\docs\termodel-ui-demo\app.js"
          $indexPath = "..\..\docs\termodel-ui-demo\index.html"
          $app = Get-Content -LiteralPath $appPath -Raw
          $index = Get-Content -LiteralPath $indexPath -Raw

          foreach ($marker in @(
            "await cadLoadGeneratedExecutiveBackground({",
            "automatic: true",
            "silentMissing: true",
            "caricato automaticamente",
            "loading = false;",
            "cadUpdateControls();"
          )) {
            if (-not $app.Contains($marker)) {
              throw "Wiring frontend esecutivo automatico mancante: $marker"
            }
          }

          if (-not $app.Contains("const APP_VERSION = '1.19';")) {
            throw "APP_VERSION frontend inattesa."
          }
          if (-not $index.Contains("./app.js?v=1.19")) {
            throw "Cache-busting app.js v1.19 non aggiornato."
          }

          foreach ($marker in @(
            "const TERMODEL_SERVICE_WAIT_STATUS = 'In Attesa di una risposta del server';",
            "function beginTermodelServiceRequest()",
            "function endTermodelServiceRequest()",
            "async function fetchTermodelService(path, options = {})",
            "cadSetStatus(TERMODEL_SERVICE_WAIT_STATUS);",
            "health?.serviceCommitShort || health?.serviceCommit",
            "health?.spiralEngine",
            "'Server '",
            "'SpiraliDiego'",
            "helpCopyLogClipboard",
            "copyCurrentTermodelLogToClipboard()",
            "/logs/termodel"
          )) {
            if (-not $app.Contains($marker)) {
              throw "Feedback attesa Termodel Service mancante: $marker"
            }
          }

          if ($app -match 'const height = Math\.max\(\s*320,') {
            throw "Viewport Android conserva ancora il minimo artificiale di 320 px."
          }
          if ($app -notmatch 'const height = Math\.max\(\s*1,') {
            throw "Viewport Android non usa l'altezza reale con guardia minima a 1 px."
          }

          Write-Host "ANDROID_LANDSCAPE_VIEWPORT_OK"

          foreach ($marker in @(
            "document.documentElement.classList.add('termodel-android', 'termodel-mobile-boot');",
            'id="termodelMobileBootSplash"',
            "function completeTermodelMobileBoot()",
            "document.documentElement.classList.remove('termodel-mobile-boot');",
            "completeTermodelMobileBoot();"
          )) {
            if (-not ($index.Contains($marker) -or $app.Contains($marker))) {
              throw "Avvio mobile anti-flash incompleto: $marker"
            }
          }

          if ($index.IndexOf("termodel-mobile-boot") -gt $index.IndexOf("<body>")) {
            throw "Il rilevamento mobile anti-flash deve essere definito nel head prima del body."
          }

          Write-Host "ANDROID_MOBILE_BOOT_SPLASH_OK"

          $catalogPath = "..\..\docs\termodel-ui-demo\examples\catalog.json"
          $radiantExamplePath = "..\..\docs\termodel-ui-demo\examples\pannelli-radianti.tmdl.txt"
          $squareExamplePath = "..\..\docs\termodel-ui-demo\examples\quadrato-con-pannelli.svg"
          $catalog = Get-Content -LiteralPath $catalogPath -Raw
          $catalogJson = $catalog | ConvertFrom-Json
          $radiantExample = Get-Content -LiteralPath $radiantExamplePath -Raw
          $squareExample = Get-Content -LiteralPath $squareExamplePath -Raw

          foreach ($marker in @(
            '"id": "pannelli-radianti"',
            '"project": "./examples/pannelli-radianti.tmdl.txt"',
            '"executive": true'
          )) {
            if (-not $catalog.Contains($marker)) {
              throw "Catalogo esempio pannelli incompleto: $marker"
            }
          }
          if ($catalog.Contains('"id": "appartamento"')) {
            throw "Il catalogo espone ancora Appartamento come esempio corrente."
          }

          if (@($catalogJson.examples).Count -lt 2) {
            throw "Il catalogo deve contenere almeno due esempi."
          }
          $squareCatalog = @($catalogJson.examples)[1]
          if ([string]$squareCatalog.id -ne "quadrato-con-pannelli" -or
              [string]$squareCatalog.name -ne "Quadrato con pannelli" -or
              [string]$squareCatalog.geometry -ne "./examples/quadrato-con-pannelli.svg" -or
              $squareCatalog.executive -ne $true) {
            throw "Quadrato con pannelli non e' il secondo esempio consolidato del catalogo."
          }

          foreach ($marker in @(
            'data-termodel-format="TERMODEL-PROJECT-SVG-V1"',
            'id="E001" x1="0" y1="0" x2="400" y2="0"',
            'id="E002" x1="400" y1="0" x2="400" y2="400"',
            'id="T001" x1="-50" y1="200" x2="50" y2="200"',
            'data-termodel-layer="Unico_tubipannelli"',
            'data-termodel-rete="RAD-DEFAULT"',
            'DESCR.,Quadrato con pannelli'
          )) {
            if (-not $squareExample.Contains($marker)) {
              throw "Esempio Quadrato con pannelli incompleto: $marker"
            }
          }
          Write-Host "RADIANT_SQUARE_PUBLIC_EXAMPLE_OK"

          foreach ($marker in @(
            "[TERMODEL-PROJECT-TEXT-V1]",
            'data-termodel-rete="RAD-DEFAULT"',
            'data-termodel-circuito="C001"',
            'data-termodel-circuito="C006"',
            "---BEGIN:archives/json/Reti.json---",
            "---BEGIN:archives/json/TipologiePannelli.json---"
          )) {
            if (-not $radiantExample.Contains($marker)) {
              throw "Progetto esempio pannelli incompleto: $marker"
            }
          }

          foreach ($marker in @(
            'id="androidExploreExecutive"',
            "Disegno esecutivo",
            'id="androidCadShowExecutive"',
            "Esecutivo pannelli",
            "async function ensureProjectBrowserExecutive()",
            "await openProjectBrowserExecutive();"
          )) {
            if (-not $app.Contains($marker)) {
              throw "Wiring esempio/esecutivo mobile mancante: $marker"
            }
          }

          foreach ($marker in @(
            'data-log-category="SpiraliDiego"',
            'id="helpCopyLogClipboard"',
            'Copia log negli appunti'
          )) {
            if (-not $index.Contains($marker)) {
              throw "Menu log SpiraliDiego incompleto: $marker"
            }
          }
          Write-Host "SPIRALI_DIEGO_FRONTEND_LOG_UI_OK"

          Write-Host "RADIANT_PUBLIC_EXAMPLE_OK"

          Write-Host "RADIANT_EXECUTIVE_AUTOLOAD_FRONTEND_OK"

      - name: Build
        run: dotnet build Termodel.WebService.sln --configuration Release --no-restore
      - name: Benchmark StrategiaDiego regression fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $benchmarkDir = Join-Path $env:RUNNER_TEMP "StrategiaDiegoBenchmark"
          New-Item -ItemType Directory -Path $benchmarkDir -Force | Out-Null

          function Invoke-DiegoBenchmark([string]$fixturePath) {
            dotnet run --project tests/StrategiaDiego.Benchmark/StrategiaDiego.Benchmark.csproj --configuration Release -- $fixturePath $benchmarkDir 20
            $exitCode = $LASTEXITCODE
            $fixtureName = [System.IO.Path]::GetFileNameWithoutExtension(
              [System.IO.Path]::GetFileNameWithoutExtension($fixturePath))
            $reportPath = Join-Path $benchmarkDir "$fixtureName.benchmark.json"

            if ($exitCode -ne 0) {
              $details = "report non disponibile"
              if (Test-Path -LiteralPath $reportPath) {
                $failedReport = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
                $details = (@($failedReport.errors) -join " | ")
              }
              Write-Host "::error title=StrategiaDiego benchmark ${fixtureName}::$details"
              throw "Benchmark $fixtureName fallito con exit code $exitCode."
            }
          }

          Invoke-DiegoBenchmark "tests/fixtures/StrategiaDiegoSquare4x4.locale.xml"
          Invoke-DiegoBenchmark "tests/fixtures/StrategiaDiegoConcaveL.locale.xml"
          Invoke-DiegoBenchmark "tests/fixtures/StrategiaDiegoObliqueTrapezoid.locale.xml"
          Invoke-DiegoBenchmark "tests/fixtures/StrategiaDiegoConnectionTerminal.locale.xml"

          "## StrategiaDiego benchmark" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| Fixture | Iterazioni | Nodi | Terminali accettati | P95 ms | Memoria byte | Deterministico |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "|---|---:|---:|---:|---:|---:|:---:|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Get-ChildItem -LiteralPath $benchmarkDir -Filter "*.benchmark.json" |
            Sort-Object Name |
            ForEach-Object {
              $report = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
              $fixture = $_.BaseName -replace '\.benchmark$', ''
              $message = "iterations=$($report.iterationsCompleted), nodes=$($report.maxTotalNodes), accepted=$($report.acceptedTerminals), p95Ms=$($report.p95ElapsedMs), memoryBytes=$($report.maxMemoryDeltaBytes), deterministic=$($report.deterministic)"
              Write-Host "::notice title=StrategiaDiego benchmark ${fixture}::$message"
              "| $fixture | $($report.iterationsCompleted) | $($report.maxTotalNodes) | $($report.acceptedTerminals) | $($report.p95ElapsedMs) | $($report.maxMemoryDeltaBytes) | $($report.deterministic) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }

      - name: Upload StrategiaDiego benchmark
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: strategia-diego-benchmark
          path: ${{ runner.temp }}/StrategiaDiegoBenchmark
          if-no-files-found: warn
          retention-days: 30
      - name: Smoke test HTTP project storage and exclusive locks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5080"
          $env:ASPNETCORE_URLS = $base
          $env:TERMODEL_PROJECT_LOCK_LEASE_SECONDS = "15"
          $env:TERMODEL_SAVED_PROJECTS_DIR = Join-Path $env:RUNNER_TEMP ("TermodelSavedProjects-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $env:TERMODEL_SAVED_PROJECTS_DIR -Force | Out-Null

          function Start-ServiceProcess {
            $p = Start-Process dotnet -ArgumentList @("run","--project","src/Termodel.WebService/Termodel.WebService.csproj","--configuration","Release","--no-build","--no-launch-profile") -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-RestMethod -Uri "$base/health" -Method Get).status -eq "ok") { return $p }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Termodel.WebService non ha risposto a /health."
          }

          function Stop-ServiceProcess($p) {
            if (-not $p) { return }
            if (-not $p.HasExited) {
              if ($IsWindows) {
                # dotnet run può avere un processo figlio che mantiene aperti
                # i file di lock anche dopo la terminazione del solo launcher.
                & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
              }
              else {
                Stop-Process -Id $p.Id -Force
              }
              try { $p.WaitForExit(5000) | Out-Null } catch {}
            }
          }

          function Set-ProjectManifest([string]$projectText,[string]$projectId,[string]$projectName) {
            $crlf = ([string][char]13)+([string][char]10)
            $normalized = $projectText.Replace($crlf,[string][char]10).Replace([string][char]13,[string][char]10)
            $begin = "---BEGIN:manifest.json---"; $end = "---END:manifest.json---"
            $bi = $normalized.IndexOf($begin,[System.StringComparison]::Ordinal)
            $cs = $bi + $begin.Length
            if ($normalized[$cs] -eq [char]10) { $cs++ }
            $ei = $normalized.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
            $manifest = $normalized.Substring($cs,$ei-$cs).TrimEnd([char]10) | ConvertFrom-Json
            $manifest | Add-Member -NotePropertyName projectId -NotePropertyValue $projectId -Force
            $manifest.projectName = $projectName
            $json = $manifest | ConvertTo-Json -Depth 100
            return $normalized.Substring(0,$cs)+$json+[char]10+$normalized.Substring($ei)
          }

          function LockHeaders([string]$token) {
            return @{ "X-Termodel-Project-Lock" = $token }
          }

          $service = $null
          try {
            $service = Start-ServiceProcess

            $health = Invoke-RestMethod -Uri "$base/health" -Method Get
            if ($health.status -ne "ok") {
              throw "Health Service non valido."
            }
            if ([string]::IsNullOrWhiteSpace([string]$health.serviceCommitShort)) {
              throw "Health Service privo del commit runtime."
            }
            if ([string]$health.spiralEngine -ne "Diego") {
              throw "Health Service deve esporre Diego come strategia default."
            }
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA) -and
                [string]$health.serviceCommitShort -ne $env:GITHUB_SHA.Substring(0,8)) {
              throw "Commit runtime health non coerente con GITHUB_SHA."
            }
            Write-Host "SERVICE_RUNTIME_IDENTITY_SMOKE_OK"
            Write-Host "service=$($health.serviceCommitShort) engine=$($health.spiralEngine)"

            # DXF -> SVG: prova reale dell'endpoint server-side con un segmento
            # lungo 1000 mm. Il risultato deve conservare layer e scala: 1,000 m.
            $dxfSource = @'
          0
          SECTION
          2
          HEADER
          9
          $INSUNITS
          70
          4
          0
          ENDSEC
          0
          SECTION
          2
          ENTITIES
          0
          LINE
          8
          WALL
          10
          0
          20
          0
          11
          1000
          21
          0
          0
          ENDSEC
          0
          EOF
          '@
            $dxfRequest = @{
              dxfText = $dxfSource
              layers = @("WALL")
              unit = "mm"
              curves = $false
              convertText = $false
              explodeBlocks = $false
            } | ConvertTo-Json -Depth 10

            $dxfResult = Invoke-RestMethod -Uri "$base/api/dxf/to-svg" -Method Post -ContentType "application/json" -Body $dxfRequest
            if ($dxfResult.stats.converted -ne 1) {
              throw "DXF -> SVG: numero entita convertite inatteso: $($dxfResult.stats.converted)"
            }
            if ([Math]::Abs([double]$dxfResult.realWidthMeters - 1.0) -gt 0.000001) {
              throw "DXF -> SVG: scala errata, larghezza=$($dxfResult.realWidthMeters) m"
            }
            if ($dxfResult.drawingUnit -ne "mm" -or [double]$dxfResult.unitScaleToCm -ne 0.1) {
              throw "DXF -> SVG: unita/scala inattese."
            }
            if ($dxfResult.svgText -notmatch 'data-dxf-layer="WALL"' -or
                $dxfResult.svgText -notmatch 'data-termodel-source-unit="mm"') {
              throw "DXF -> SVG: metadata SVG attesi non trovati."
            }
            Write-Host "DXF_TO_SVG_SMOKE_OK"

            # Regression reale: Farmacia.dxf fornito dall'utente.
            # La fixture è conservata lossless come gzip/base64 per limitare
            # il peso Git; qui viene ricostruita byte-per-byte.
            $fixtureB64 = Get-Content "tests/fixtures/Farmacia.dxf.gz.b64" -Raw
            $fixtureGzipBytes = [Convert]::FromBase64String($fixtureB64.Trim())
            $fixtureInput = [System.IO.MemoryStream]::new($fixtureGzipBytes)
            $fixtureGzip = [System.IO.Compression.GZipStream]::new(
              $fixtureInput,
              [System.IO.Compression.CompressionMode]::Decompress
            )
            $fixtureOutput = [System.IO.MemoryStream]::new()
            $fixtureGzip.CopyTo($fixtureOutput)
            $fixtureGzip.Dispose()
            $fixtureInput.Dispose()
            $fixtureBytes = $fixtureOutput.ToArray()
            $fixtureOutput.Dispose()

            $fixtureSha = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData($fixtureBytes)
            ).ToLowerInvariant()
            if ($fixtureSha -ne "81b7e14c361b0b5de94a877c715091b77a42f599c6a757ca1fc2906251496adc") {
              throw "Farmacia.dxf: SHA-256 inatteso $fixtureSha"
            }

            $fixtureText = [System.Text.UTF8Encoding]::new($false).GetString($fixtureBytes)
            $farmaciaRequest = @{
              dxfText = $fixtureText
              layers = $null
              unit = $null
              curves = $false
              convertText = $false
              explodeBlocks = $false
              profile = "architectural"
            } | ConvertTo-Json -Depth 10

            $farmacia = Invoke-RestMethod -Uri "$base/api/dxf/to-svg" -Method Post -ContentType "application/json" -Body $farmaciaRequest
            $farmaciaLayers = @($farmacia.appliedLayers)

            if ($farmacia.profile -ne "architectural") {
              throw "Farmacia.dxf: profilo applicato inatteso '$($farmacia.profile)'."
            }
            if ($farmacia.drawingUnit -ne "m" -or [double]$farmacia.unitScaleToCm -ne 100.0) {
              throw "Farmacia.dxf: $INSUNITS=6 non riconosciuto come metri."
            }
            foreach ($requiredLayer in @("0","01-SEZIONI","02-PROIEZIONI")) {
              if ($farmaciaLayers -notcontains $requiredLayer) {
                throw "Farmacia.dxf: layer architettonico mancante $requiredLayer."
              }
            }
            foreach ($noiseLayer in @("03-QUOTE","04-RETINI")) {
              if ($farmaciaLayers -contains $noiseLayer -or
                  $farmacia.svgText -match ('data-dxf-layer="' + [regex]::Escape($noiseLayer) + '"')) {
                throw "Farmacia.dxf: layer di rumore non filtrato $noiseLayer."
              }
            }
            if ([double]$farmacia.realWidthMeters -lt 18.9 -or [double]$farmacia.realWidthMeters -gt 19.2) {
              throw "Farmacia.dxf: larghezza architettonica inattesa $($farmacia.realWidthMeters) m."
            }
            if ([double]$farmacia.realHeightMeters -lt 17.0 -or [double]$farmacia.realHeightMeters -gt 17.3) {
              throw "Farmacia.dxf: altezza architettonica inattesa $($farmacia.realHeightMeters) m."
            }
            if ([int]$farmacia.stats.converted -lt 200) {
              throw "Farmacia.dxf: troppo poche entita architettoniche convertite: $($farmacia.stats.converted)."
            }
            if ($farmacia.svgText -notmatch 'data-dxf-role="section"' -or
                $farmacia.svgText -notmatch 'data-dxf-role="projection"' -or
                $farmacia.svgText -notmatch 'data-termodel-dxf-profile="architectural"') {
              throw "Farmacia.dxf: gerarchia grafica architettonica non presente nello SVG."
            }

            $dxfRegressionDir = Join-Path $env:RUNNER_TEMP "TermodelDxfRegression"
            New-Item -ItemType Directory -Path $dxfRegressionDir -Force | Out-Null
            [System.IO.File]::WriteAllText(
              (Join-Path $dxfRegressionDir "Farmacia.architectural.svg"),
              [string]$farmacia.svgText,
              [System.Text.UTF8Encoding]::new($false)
            )
            @{
              sourceSha256 = $fixtureSha
              profile = $farmacia.profile
              appliedLayers = $farmaciaLayers
              converted = [int]$farmacia.stats.converted
              ignored = [int]$farmacia.stats.ignored
              unsupported = [int]$farmacia.stats.unsupported
              widthMeters = [double]$farmacia.realWidthMeters
              heightMeters = [double]$farmacia.realHeightMeters
              units = $farmacia.drawingUnit
            } | ConvertTo-Json -Depth 10 | Set-Content (
              Join-Path $dxfRegressionDir "Farmacia.architectural.json"
            ) -Encoding utf8

            Write-Host "FARMACIA_DXF_ARCHITECTURAL_SMOKE_OK"
            Write-Host "Farmacia layers=$($farmaciaLayers -join ',') converted=$($farmacia.stats.converted) size=$([Math]::Round([double]$farmacia.realWidthMeters,3))x$([Math]::Round([double]$farmacia.realHeightMeters,3))m"

            $baseProject = Invoke-RestMethod -Uri "$base/api/projects/new" -Method Post -ContentType "application/json" -Body "{}"

            # Flusso frontend corrente: projectId generato localmente, nessuna
            # allocazione/open/lock preventiva. Il POST deve creare da zero il
            # workspace tecnico e rendere subito leggibile model3d.
            $localProjectId = [guid]::NewGuid()
            $localProject = Set-ProjectManifest $baseProject ([string]$localProjectId) "Progetto Locale Frontend"
            $localCalc = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body $localProject
            if ($localCalc.projectId -ne $localProjectId) {
              throw "Calcolo progetto locale ha restituito projectId inatteso."
            }
            $localDir = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$localProjectId)
            if (-not (Test-Path (Join-Path $localDir "project.tmdl"))) {
              throw "AggiornaCalcolo non ha creato il workspace per projectId locale."
            }
            $localModel = Invoke-WebRequest -Uri "$base/api/projects/$localProjectId/artifacts/model3d" -Method Get
            if ($localModel.StatusCode -ne 200 -or $localModel.Headers["X-Termodel-Artifact-Stale"] -ne "false") {
              throw "Artifact model3d del progetto locale non disponibile dopo AggiornaCalcolo."
            }
            Write-Host "LOCAL_PROJECT_CALCULATION_SMOKE_OK"

            foreach ($requiredSection in @(
              "definition/reti-pannelli-definizionedati.json",
              "archives/json/Reti.json",
              "archives/json/TipologiePannelli.json",
              "archives/xml/Reti.xml",
              "archives/xml/TipologiePannelli.xml"
            )) {
              if ($baseProject -notmatch [regex]::Escape("---BEGIN:$requiredSection---")) {
                throw "Progetto nuovo privo della sezione Reti/Pannelli obbligatoria: $requiredSection"
              }
            }

            if ($baseProject -match [regex]::Escape("---BEGIN:archives/json/Tubazioni.json---") -or
                $baseProject -match [regex]::Escape("---BEGIN:archives/json/Fluidi.json---")) {
              throw "Il nuovo progetto non deve più generare gli archivi separati Tubazioni/Fluidi."
            }

            function Read-ProjectJsonSection([string]$projectText,[string]$sectionName) {
              $begin = "---BEGIN:$sectionName---"
              $end = "---END:$sectionName---"
              $bi = $projectText.IndexOf($begin,[System.StringComparison]::Ordinal)
              if ($bi -lt 0) { throw "Sezione $sectionName non trovata." }
              $cs = $bi + $begin.Length
              while ($cs -lt $projectText.Length -and ($projectText[$cs] -eq [char]13 -or $projectText[$cs] -eq [char]10)) { $cs++ }
              $ei = $projectText.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
              if ($ei -lt 0) { throw "Sezione $sectionName non chiusa." }
              return $projectText.Substring($cs,$ei-$cs).Trim() | ConvertFrom-Json
            }

            function Add-RadiantPipeToProject([string]$projectText,[string]$floorName,[string]$networkCode) {
              $sectionName = "geometry/project.svg"
              $begin = "---BEGIN:$sectionName---"
              $end = "---END:$sectionName---"
              $bi = $projectText.IndexOf($begin,[System.StringComparison]::Ordinal)
              if ($bi -lt 0) { throw "Sezione $sectionName non trovata per smoke Tubo." }
              $cs = $bi + $begin.Length
              while ($cs -lt $projectText.Length -and ($projectText[$cs] -eq [char]13 -or $projectText[$cs] -eq [char]10)) { $cs++ }
              $ei = $projectText.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
              if ($ei -lt 0) { throw "Sezione $sectionName non chiusa per smoke Tubo." }

              $geometry = $projectText.Substring($cs,$ei-$cs)
              $groupStart = $geometry.IndexOf("<g ",[System.StringComparison]::OrdinalIgnoreCase)
              if ($groupStart -lt 0) { throw "Nessun gruppo piano trovato in geometry/project.svg." }

              $layer = $floorName + "_tubipannelli"
              $pipe = "<line id=`"T001`" x1=`"10`" y1=`"10`" x2=`"110`" y2=`"10`" data-termodel-piano=`"$floorName`" data-termodel-layer=`"$layer`" data-termodel-entity=`"Tubo`" data-termodel-rete=`"$networkCode`" data-termodel-linetype=`"Continuous`" data-termodel-color=`"1`" />"

              $closeGroup = $geometry.IndexOf("</g>",$groupStart,[System.StringComparison]::OrdinalIgnoreCase)
              if ($closeGroup -ge 0) {
                $geometry = $geometry.Insert($closeGroup,$pipe + [Environment]::NewLine)
              }
              else {
                # Il ProgettoVuoto canonico usa un gruppo piano autochiuso <g ... />.
                $selfClose = $geometry.IndexOf(" />",$groupStart,[System.StringComparison]::Ordinal)
                if ($selfClose -lt 0) { throw "Gruppo piano SVG non chiuso in forma supportata." }
                $replacement = ">" + [Environment]::NewLine + $pipe + [Environment]::NewLine + "</g>"
                $geometry = $geometry.Remove($selfClose,3).Insert($selfClose,$replacement)
              }

              return $projectText.Substring(0,$cs) + $geometry + $projectText.Substring($ei)
            }

            function Set-RadiantStepInXml([string]$projectText,[int]$stepMm) {
              $sectionName = "archives/xml/Reti.xml"
              $begin = "---BEGIN:$sectionName---"
              $end = "---END:$sectionName---"
              $bi = $projectText.IndexOf($begin,[System.StringComparison]::Ordinal)
              if ($bi -lt 0) { throw "Sezione $sectionName non trovata per smoke validazione passo." }
              $cs = $bi + $begin.Length
              while ($cs -lt $projectText.Length -and ($projectText[$cs] -eq [char]13 -or $projectText[$cs] -eq [char]10)) { $cs++ }
              $ei = $projectText.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
              if ($ei -lt 0) { throw "Sezione $sectionName non chiusa per smoke validazione passo." }

              $xml = $projectText.Substring($cs,$ei-$cs)
              $key = "<Key>PassoSelezionatoMm</Key>"
              $ki = $xml.IndexOf($key,[System.StringComparison]::Ordinal)
              if ($ki -lt 0) { throw "PassoSelezionatoMm non trovato nell'XML Reti." }
              $vi = $xml.IndexOf("<Value",$ki,[System.StringComparison]::Ordinal)
              $gt = $xml.IndexOf(">",$vi,[System.StringComparison]::Ordinal)
              $ve = $xml.IndexOf("</Value>",$gt,[System.StringComparison]::Ordinal)
              if ($vi -lt 0 -or $gt -lt 0 -or $ve -lt 0) { throw "Value di PassoSelezionatoMm non leggibile." }
              $xml = $xml.Substring(0,$gt + 1) + $stepMm + $xml.Substring($ve)

              return $projectText.Substring(0,$cs) + $xml + $projectText.Substring($ei)
            }

            $reti = @(Read-ProjectJsonSection $baseProject "archives/json/Reti.json")
            $tipologiePannelli = @(Read-ProjectJsonSection $baseProject "archives/json/TipologiePannelli.json")
            if ($reti.Count -ne 1) { throw "Reti deve essere precompilato con una rete pannelli." }
            if ($reti[0].Codice -ne "RAD-DEFAULT" -or $reti[0].TipoRete -ne "PannelliRadianti") { throw "Rete pannelli default inattesa." }
            if ($reti[0].CodiceTipologiaPannello -ne "GEN-DEFAULT" -or $reti[0].PassoSelezionatoMm -ne 300) { throw "Rete default non collega correttamente tipologia e passo." }
            if ($reti[0].TemperaturaMandataC -ne 35 -or $reti[0].TemperaturaRitornoC -ne 30 -or $reti[0].PerditaCaricoMassimaCircuitoPa -ne 25000) { throw "Parametri di esercizio rete default inattesi." }
            if ($tipologiePannelli.Count -ne 1) { throw "TipologiePannelli non precompilato." }
            if ($tipologiePannelli[0].CasaProduttrice -ne "Generico" -or $tipologiePannelli[0].Modello -ne "Default Termodel") { throw "Tipologia pannello default inattesa." }
            if ($tipologiePannelli[0].DiametroInternoTuboMm -ne 12 -or $tipologiePannelli[0].MaterialeTubo -ne "PE-Xa") { throw "Caratteristiche tubo pannello default inattese." }
            if ($tipologiePannelli[0].PassiDisponibiliMm -notmatch "(^|;)300(;|$)") { throw "La tipologia pannello default non ammette il passo rete 300 mm." }

            $frontEmptyProjectPath = Join-Path $PWD "..\..\SorgentiTermodel\Library\projects\ProgettoVuoto\ProgettoVuoto.termodel.txt"
            $frontEmptyProject = [System.IO.File]::ReadAllText($frontEmptyProjectPath,[System.Text.UTF8Encoding]::new($false))
            foreach ($archiveName in @("Reti","TipologiePannelli")) {
              if ($frontEmptyProject -notmatch [regex]::Escape("---BEGIN:archives/json/$archiveName.json---")) {
                throw "ProgettoVuoto frontend privo dell'archivio $archiveName."
              }
            }
            if ($frontEmptyProject -match [regex]::Escape("---BEGIN:archives/json/Tubazioni.json---") -or
                $frontEmptyProject -match [regex]::Escape("---BEGIN:archives/json/Fluidi.json---")) {
              throw "ProgettoVuoto contiene ancora archivi separati Tubazioni/Fluidi."
            }
            Write-Host "RADIANT_NETWORK_ARCHIVES_SMOKE_OK"

            $legacy = Invoke-RestMethod -Uri "$base/api/model/3d" -Method Post -ContentType "text/plain; charset=utf-8" -Body $baseProject
            if ($legacy.format -ne "TermodelWebModel" -or $legacy.version -ne 3) { throw "Endpoint legacy model3d non compatibile." }

            $allocA = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            $allocB = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            if ($allocA.projectId -eq $allocB.projectId) { throw "projectId duplicati." }
            if (-not $allocA.projectLockToken -or -not $allocB.projectLockToken) { throw "Lock token iniziale mancante." }

            $projectA = Set-ProjectManifest $baseProject ([string]$allocA.projectId) "Progetto A"
            $projectB = Set-ProjectManifest $baseProject ([string]$allocB.projectId) "Progetto B"
            $headersA = LockHeaders ([string]$allocA.projectLockToken)
            $headersB = LockHeaders ([string]$allocB.projectLockToken)

            $saveA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/save" -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            $saveB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/save" -Method Put -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if (-not $saveA.artifactsStale -or -not $saveB.artifactsStale) { throw "Il primo salvataggio deve marcare gli artifact stale." }

            $dirA = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocA.projectId)
            $dirB = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocB.projectId)
            if (-not (Test-Path (Join-Path $dirA "project.tmdl")) -or -not (Test-Path (Join-Path $dirB "project.tmdl"))) { throw "project.tmdl non persistito nelle cartelle progetto." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null
            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            $secondOpen = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post -SkipHttpErrorCheck
            if ($secondOpen.StatusCode -ne 423) { throw "La doppia apertura dello stesso progetto deve restituire 423." }

            $openB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/open" -Method Post
            $headersB = LockHeaders ([string]$openB.projectLockToken
            )
            if ($openB.projectId -ne $allocB.projectId) { throw "Apertura contemporanea del progetto B fallita." }

            # Compatibilità: eventuali header lock dei vecchi client sono
            # ignorati da AggiornaCalcolo; il calcolo non dipende più dal lease.
            $badHeaders = LockHeaders ([guid]::NewGuid().ToString("D"))
            $calcWithLegacyHeader = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -Headers $badHeaders -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($calcWithLegacyHeader.projectId -ne $allocA.projectId) {
              throw "Aggiorna Modello non deve dipendere dal vecchio header lock."
            }

            $calcA = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($calcA.projectId -ne $allocA.projectId -or $calcA.PSObject.Properties["calculationId"]) { throw "Response calcolo A non valida." }

            # Smoke end-to-end Tubo: il file unico porta una linea tecnica sul
            # layer Desktop <NomePiano>_tubipannelli fino a LeggiDxf/IoPannelli.
            $pianiA = @(Read-ProjectJsonSection $projectA "archives/json/Piani.json")
            if ($pianiA.Count -lt 1 -or [string]::IsNullOrWhiteSpace([string]$pianiA[0].Nome)) { throw "Piano smoke Tubo non disponibile." }
            $pipeFloor = [string]$pianiA[0].Nome
            $pipeLayer = $pipeFloor + "_tubipannelli"
            $projectATube = Add-RadiantPipeToProject $projectA $pipeFloor "RAD-DEFAULT"
            if ($projectATube -notmatch [regex]::Escape('data-termodel-rete="RAD-DEFAULT"') -or
                $projectATube -notmatch [regex]::Escape("data-termodel-layer=`"$pipeLayer`"")) {
              throw "Il file unico smoke non contiene i metadati Tubo attesi."
            }

            $calcATube = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body $projectATube
            if ($calcATube.projectId -ne $allocA.projectId) { throw "Calcolo con Tubo non completato sul progetto A." }
            if (@($calcATube.artifacts.name) -notcontains "pannelli") { throw "Response Aggiorna Modello priva dell'artifact pannelli." }

            $panelsPathA = Join-Path $dirA "artifacts\pannelli.json"
            if (-not (Test-Path $panelsPathA)) { throw "pannelli.json non persistito nel workspace progetto." }

            $panelsResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/pannelli" -Method Get
            if ($panelsResponse.StatusCode -ne 200) { throw "GET artifact pannelli deve restituire 200." }
            if ($panelsResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "Artifact pannelli appena calcolato marcato stale." }
            if ($panelsResponse.Headers["Content-Type"] -notmatch "^application/json") { throw "Content-Type artifact pannelli inatteso." }

            $panels = $panelsResponse.Content | ConvertFrom-Json
            if ($panels.format -ne "TermodelRadiantPanels" -or $panels.version -ne 1 -or $panels.status -ne "completed") {
              throw "Formato artifact pannelli non valido."
            }
            if ($panels.networkCount -ne 1 -or $panels.circuitCount -ne 1) {
              throw "Artifact pannelli deve contenere una rete e un circuito nel caso smoke."
            }

            $network = @($panels.networks)[0]
            $circuit = @($network.circuits)[0]
            if ($network.networkCode -ne "RAD-DEFAULT" -or $network.panelCode -ne "GEN-DEFAULT") {
              throw "Artifact pannelli non conserva rete/tipologia progetto."
            }
            if ($network.stepMm -ne 300 -or $network.internalDiameterMm -ne 12) {
              throw "Artifact pannelli non usa passo/diametro degli archivi."
            }
            if ($circuit.floorName -ne $pipeFloor -or $circuit.segmentCount -ne 1) {
              throw "Circuito pannelli non associato correttamente al piano/Tubo."
            }
            if ([Math]::Abs([double]$circuit.geometricLengthM - 1.0) -gt 0.000001 -or
                [Math]::Abs([double]$circuit.hydraulicLengthM - 1.0) -gt 0.000001) {
              throw "Lunghezza circuito smoke inattesa: geometric=$($circuit.geometricLengthM), hydraulic=$($circuit.hydraulicLengthM)."
            }
            if ([Math]::Abs([double]$circuit.stepFactorMPerM2 - 3.4) -gt 0.000001) {
              throw "Fattore passo 300 mm inatteso."
            }
            if ([double]$circuit.flowM3S -le 0 -or
                [double]$circuit.reynolds -le 0 -or
                [double]$circuit.pressureLossPa -le 0) {
              throw "Kernel Darcy non ha prodotto portata/Reynolds/perdita positivi."
            }
            # Golden numerico sintetico: T001 lungo 1 m, passo 300 mm, PE-Xa 12 mm,
            # acqua 35/30 °C, coefficiente resa 5 W/m2K.
            if ([Math]::Abs([double]$circuit.flowLitersHour - 3.1826793) -gt 0.01 -or
                [Math]::Abs([double]$circuit.reynolds - 123.4017) -gt 0.5 -or
                [Math]::Abs([double]$circuit.pressureLossPa - 1.313675) -gt 0.02) {
              throw "Golden Darcy sintetico fuori tolleranza: flow=$($circuit.flowLitersHour) L/h, Re=$($circuit.reynolds), dP=$($circuit.pressureLossPa) Pa."
            }

            $panelsHashBeforeInvalidStep = (Get-FileHash -LiteralPath $panelsPathA -Algorithm SHA256).Hash
            $invalidStepProject = Set-RadiantStepInXml $projectATube 333
            $invalidStepResponse = Invoke-WebRequest -Uri "$base/api/calculations" -Method Post -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $invalidStepProject -SkipHttpErrorCheck
            if ($invalidStepResponse.StatusCode -ne 422) { throw "Passo rete non ammesso deve restituire 422." }
            Write-Host "RADIANT_INVALID_STEP_STATUS_422"
            $panelsHashAfterInvalidStep = (Get-FileHash -LiteralPath $panelsPathA -Algorithm SHA256).Hash
            if ($panelsHashBeforeInvalidStep -ne $panelsHashAfterInvalidStep) {
              throw "Calcolo con passo non valido ha sostituito l'ultimo artifact pannelli valido."
            }
            Write-Host "RADIANT_PANEL_DARCY_SMOKE_OK"

            $persistedTubeProject = [System.IO.File]::ReadAllText((Join-Path $dirA "project.tmdl"),[System.Text.UTF8Encoding]::new($false))
            if ($persistedTubeProject -notmatch [regex]::Escape("data-termodel-layer=`"$pipeLayer`"") -or
                $persistedTubeProject -notmatch [regex]::Escape('data-termodel-entity="Tubo"') -or
                $persistedTubeProject -notmatch [regex]::Escape('data-termodel-rete="RAD-DEFAULT"')) {
              throw "project.tmdl non ha conservato il Tubo della rete."
            }

            $termodelLogPathA = Join-Path $dirA "logs\TermodelLog.md"
            $diagnosticsPathA = Join-Path $dirA "logs\diagnostics.txt"
            if (-not (Test-Path $termodelLogPathA)) { throw "TermodelLog.md non persistito nel workspace del progetto." }
            if (-not (Test-Path $diagnosticsPathA)) { throw "diagnostics.txt non persistito." }

            $termodelLogFileA = [System.IO.File]::ReadAllText($termodelLogPathA,[System.Text.UTF8Encoding]::new($false))
            $diagnosticsFileA = [System.IO.File]::ReadAllText($diagnosticsPathA,[System.Text.UTF8Encoding]::new($false))
            if ([string]::IsNullOrWhiteSpace($termodelLogFileA)) { throw "TermodelLog.md esiste ma non contiene messaggi: logging Core non attivo." }
            if ($termodelLogFileA -ne $diagnosticsFileA) { throw "TermodelLog.md e diagnostics.txt devono rappresentare lo stesso log Core corrente." }
            if ($termodelLogFileA -notmatch [regex]::Escape("Letti 1 tubi dal layer $pipeLayer")) { throw "Il Core non ha acquisito T001 dal layer pannelli atteso." }
            Write-Host "RADIANT_PIPE_FILE_UNIQUE_SMOKE_OK"


            $termodelLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($termodelLogResponse.StatusCode -ne 200) { throw "GET TermodelLog deve restituire 200." }
            if ($termodelLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "TermodelLog appena calcolato marcato stale." }
            if ($termodelLogResponse.Headers["Content-Type"] -notmatch "^text/markdown") { throw "Content-Type TermodelLog inatteso." }
            if ($termodelLogResponse.Content -ne $termodelLogFileA) { throw "GET TermodelLog non restituisce il file persistito byte/logicamente identico." }

            $missingLogId = [guid]::NewGuid().ToString("D")
            $missingLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$missingLogId/logs/termodel" -Method Get -SkipHttpErrorCheck
            if ($missingLogResponse.StatusCode -ne 404) { throw "TermodelLog inesistente deve restituire 404." }

            $logHashBeforeFailure = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            $invalidProjectA = $projectA.Replace('data-termodel-units="cm"', 'data-termodel-units="invalid"')
            if ($invalidProjectA -eq $projectA) { throw "Smoke non ha trovato l'attributo SVG da invalidare." }
            $failedCalc = Invoke-WebRequest -Uri "$base/api/calculations" -Method Post -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $invalidProjectA -SkipHttpErrorCheck
            if ($failedCalc.StatusCode -ne 422) { throw "Calcolo volutamente non valido deve restituire 422." }
            $logHashAfterFailure = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            if ($logHashBeforeFailure -ne $logHashAfterFailure) { throw "Un calcolo fallito ha sostituito il TermodelLog dell'ultimo calcolo valido." }

            $modelResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($modelResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "Artifact appena calcolato marcato stale." }

            # Configurazione logging per singola elaborazione sul progetto B.
            $logAHashBeforeB = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash

            $calcBDisabled = Invoke-RestMethod -Uri "$base/api/calculations?logEnabled=false" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBDisabled.logging.enabled -ne $false -or $calcBDisabled.logging.mode -ne "disabled") { throw "logEnabled=false non applicato." }
            if (@($calcBDisabled.diagnostics).Count -ne 0) { throw "Logging disabilitato deve produrre zero diagnostiche." }

            $termodelLogPathB = Join-Path $dirB "logs\TermodelLog.md"
            $calculationLogPathB = Join-Path $dirB "logs\calculation.log"
            if (-not (Test-Path $termodelLogPathB)) { throw "TermodelLog B non persistito con logging disabilitato." }
            if ((Get-Content -LiteralPath $termodelLogPathB -Raw).Length -ne 0) { throw "TermodelLog B deve essere vuoto con logEnabled=false." }
            $calcMetaDisabled = Get-Content -LiteralPath $calculationLogPathB -Raw
            if ($calcMetaDisabled -notmatch "logEnabled=false" -or $calcMetaDisabled -notmatch "logMode=disabled") { throw "calculation.log non registra logging disabilitato." }

            $calcBError = Invoke-RestMethod -Uri "$base/api/calculations?logCategories=Error" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBError.logging.enabled -ne $true -or $calcBError.logging.mode -ne "filtered") { throw "Filtro log Error non applicato." }
            if (@($calcBError.logging.categories).Count -ne 1 -or $calcBError.logging.categories[0] -ne "Error") { throw "Categoria Error non riportata correttamente." }
            $errorOnlyLog = Get-Content -LiteralPath $termodelLogPathB -Raw
            if ($errorOnlyLog -notmatch "(?m)^error:") { throw "Filtro Error non ha conservato il messaggio di errore atteso." }
            if ($errorOnlyLog -match "(?m)^operation:" -or $errorOnlyLog -match "(?m)^info:") { throw "Filtro Error ha lasciato passare categorie non richieste." }

            $calcBAll = Invoke-RestMethod -Uri "$base/api/calculations?logCategories=all" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBAll.logging.mode -ne "filtered" -or @($calcBAll.logging.categories).Count -ne 9) { throw "logCategories=all non abilita tutte le 9 categorie Desktop." }
            $allLog = Get-Content -LiteralPath $termodelLogPathB -Raw
            if ([string]::IsNullOrWhiteSpace($allLog)) { throw "logCategories=all deve produrre un log non vuoto." }
            $calcMetaAll = Get-Content -LiteralPath $calculationLogPathB -Raw
            if ($calcMetaAll -notmatch "logMode=filtered" -or $calcMetaAll -notmatch "PontiAutomatici") { throw "calculation.log non registra le categorie abilitate." }

            $logBHashBeforeInvalid = (Get-FileHash -LiteralPath $termodelLogPathB -Algorithm SHA256).Hash
            $invalidLogConfig = Invoke-WebRequest -Uri "$base/api/calculations?logCategories=colmi,inesistente" -Method Post -ContentType "text/plain; charset=utf-8" -Body $projectB -SkipHttpErrorCheck
            if ($invalidLogConfig.StatusCode -ne 400) { throw "Categoria log sconosciuta deve restituire 400." }
            $logBHashAfterInvalid = (Get-FileHash -LiteralPath $termodelLogPathB -Algorithm SHA256).Hash
            if ($logBHashBeforeInvalid -ne $logBHashAfterInvalid) { throw "Configurazione log invalida ha modificato il log valido precedente." }

            $logAHashAfterB = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            if ($logAHashBeforeB -ne $logAHashAfterB) { throw "Le configurazioni log del progetto B hanno contaminato il log del progetto A." }

            $renamed = "Progetto A Rinominato"
            $saveAsUrl = "$base/api/projects/$($allocA.projectId)/save-as?projectName=$([uri]::EscapeDataString($renamed))"
            $saveAs = Invoke-RestMethod -Uri $saveAsUrl -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($saveAs.projectId -ne $allocA.projectId -or $saveAs.projectName -ne $renamed) { throw "Salva con nome ha cambiato projectId o nome errato." }

            $savedText = [System.IO.File]::ReadAllText((Join-Path $dirA "project.tmdl"),[System.Text.UTF8Encoding]::new($false))
            if ($savedText -notmatch [regex]::Escape([string]$allocA.projectId) -or $savedText -notmatch [regex]::Escape($renamed)) { throw "project.tmdl rinominato non conserva projectId/nome." }

            $staleResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($staleResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Salva con nome deve rendere stale gli artifact." }

            $staleLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($staleLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Salva con nome deve rendere stale anche il TermodelLog corrente." }

            $heartbeat = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/heartbeat" -Method Post -Headers $headersA
            if ($heartbeat.status -ne "locked") { throw "Heartbeat lock fallito." }

            $unlockNeedsConfirm = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/unlock" -Method Post -SkipHttpErrorCheck
            if ($unlockNeedsConfirm.StatusCode -ne 409) { throw "Sblocco di lock vivo senza force deve richiedere conferma 409." }
            $forcedUnlock = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/unlock?force=true" -Method Post
            if ($forcedUnlock.status -ne "unlocked") { throw "Sblocco forzato fallito." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            Start-Sleep -Seconds 16
            $openAfterExpiry = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openAfterExpiry.projectLockToken)

            $list = Invoke-RestMethod -Uri "$base/api/projects" -Method Get
            $listedIds = @($list.projects | ForEach-Object { [string]$_.projectId })
            foreach ($expectedId in @(
              [string]$localProjectId,
              [string]$allocA.projectId,
              [string]$allocB.projectId
            )) {
              if ($listedIds -notcontains $expectedId) {
                throw "Elenco progetti legacy non contiene il projectId atteso $expectedId."
              }
            }

            # Simula crash: lascia A aperto, termina il Service senza close e riavvia.
            Stop-ServiceProcess $service
            $service = $null
            $service = Start-ServiceProcess

            $recoveredA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$recoveredA.projectLockToken)
            if ($recoveredA.projectName -ne $renamed) { throw "Recovery dopo restart non ha riaperto il progetto rinominato." }

            $restartedLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($restartedLogResponse.StatusCode -ne 200) { throw "TermodelLog non leggibile dopo restart Service." }
            if ($restartedLogResponse.Content -ne $termodelLogFileA) { throw "TermodelLog cambiato dopo restart Service." }
            if ($restartedLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Dopo Salva con nome/restart il TermodelLog deve restare stale." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null

            Write-Host "TERMODEL_LOG_OPTIONS_SMOKE_OK"
            Write-Host "TERMODEL_LOG_SMOKE_OK"
            Write-Host "PROJECT_LOCK_SMOKE_OK"
            Write-Host "projectIdA=$($allocA.projectId)"
            Write-Host "projectIdB=$($allocB.projectId)"
          }
          finally {
            Stop-ServiceProcess $service
            if ($env:TERMODEL_SAVED_PROJECTS_DIR -and (Test-Path $env:TERMODEL_SAVED_PROJECTS_DIR)) {
              Remove-Item $env:TERMODEL_SAVED_PROJECTS_DIR -Recurse -Force
            }
          }


      - name: Upload DXF regression artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dxf-svg-regression
          path: ${{ runner.temp }}/TermodelDxfRegression
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test GitHub feedback bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5081"
          $capture = Join-Path $env:RUNNER_TEMP "termodel-feedback-capture.json"
          $serviceOut = Join-Path $env:RUNNER_TEMP "termodel-feedback-service.out.log"
          $serviceErr = Join-Path $env:RUNNER_TEMP "termodel-feedback-service.err.log"
          $stubOut = Join-Path $env:RUNNER_TEMP "termodel-feedback-stub.out.log"
          $stubErr = Join-Path $env:RUNNER_TEMP "termodel-feedback-stub.err.log"
          $env:ASPNETCORE_URLS = $base
          $env:TERMODEL_FEEDBACK_GITHUB_TOKEN = "test-token"
          $env:TERMODEL_FEEDBACK_REPOSITORY = "Fetonte1960/Termodel"
          $env:TERMODEL_FEEDBACK_ALLOWED_ORIGIN = "https://www.termodel.it"
          $env:TERMODEL_FEEDBACK_GITHUB_API_BASE_URL = "http://127.0.0.1:5099"

          function Start-ServiceProcess {
            $p = Start-Process dotnet -ArgumentList @("run","--project","src/Termodel.WebService/Termodel.WebService.csproj","--configuration","Release","--no-build","--no-launch-profile") -RedirectStandardOutput $serviceOut -RedirectStandardError $serviceErr -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-RestMethod -Uri "$base/health" -Method Get).status -eq "ok") { return $p }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Termodel.WebService feedback smoke non ha risposto a /health."
          }

          function Stop-ChildProcess($p) {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit(5000) | Out-Null
            }
          }

          $stub = $null
          $service = $null

          try {
            $stub = Start-Process python -ArgumentList @("tests/github_feedback_stub.py",$capture) -RedirectStandardOutput $stubOut -RedirectStandardError $stubErr -PassThru

            $probeBody = '{"title":"probe","body":"probe"}'
            $probe = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if ($stub.HasExited) {
                if (Test-Path $stubErr) { Get-Content $stubErr | Write-Host }
                throw "Stub GitHub non avviato."
              }

              try {
                $probe = Invoke-WebRequest -Uri "http://127.0.0.1:5099/repos/Fetonte1960/Termodel/issues" -Method Post -Headers @{ Authorization = "Bearer test-token" } -ContentType "application/json" -Body $probeBody -SkipHttpErrorCheck
                if ($probe.StatusCode -eq 201) { break }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }

            if (-not $probe -or $probe.StatusCode -ne 201) {
              if (Test-Path $stubErr) { Get-Content $stubErr | Write-Host }
              throw "Stub GitHub non raggiungibile entro il timeout di avvio."
            }
            Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue

            $service = Start-ServiceProcess

            $validBody = @{
              message = "Vorrei un comando per confrontare due varianti del progetto."
              category = "suggestion"
              title = "Confronto varianti"
              page = "/termodel-ui-demo/?token-da-non-inviare=123"
              appVersion = "0.98"
            } | ConvertTo-Json

            $badOrigin = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://evil.example" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($badOrigin.StatusCode -ne 403) { throw "Origine feedback non autorizzata: atteso 403, ricevuto $($badOrigin.StatusCode)." }

            $invalidBody = @{ message = "x"; category = "invalid" } | ConvertTo-Json
            $invalid = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $invalidBody -SkipHttpErrorCheck
            if ($invalid.StatusCode -ne 400) { throw "Payload feedback non valido: atteso 400, ricevuto $($invalid.StatusCode)." }

            $createdResponse = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($createdResponse.StatusCode -ne 201) {
              Write-Host "Feedback response: $($createdResponse.Content)"
              if (Test-Path $serviceOut) { Get-Content $serviceOut | Select-Object -Last 80 | Write-Host }
              if (Test-Path $serviceErr) { Get-Content $serviceErr | Select-Object -Last 80 | Write-Host }
              if (Test-Path $stubErr) { Get-Content $stubErr | Select-Object -Last 80 | Write-Host }
              throw "Creazione feedback: atteso 201, ricevuto $($createdResponse.StatusCode)."
            }

            $created = $createdResponse.Content | ConvertFrom-Json
            if ($created.status -ne "created" -or $created.issueNumber -ne 4242) { throw "Risposta feedback creata non valida." }

            if (-not (Test-Path -LiteralPath $capture)) { throw "Stub GitHub non ha ricevuto la richiesta issue." }
            $captured = Get-Content -LiteralPath $capture -Raw | ConvertFrom-Json

            if ($captured.path -ne "/repos/Fetonte1960/Termodel/issues") { throw "Path GitHub Issues inatteso: $($captured.path)" }
            if ($captured.authorization -ne "Bearer test-token") { throw "Authorization GitHub non corretta." }
            if ($captured.userAgent -notmatch "Termodel-WebService") { throw "User-Agent GitHub non corretto." }
            if ($captured.payload.title -notmatch "^\[Termodel Feedback/Suggestion\]") { throw "Titolo GitHub Issue inatteso." }
            if ($captured.payload.body -notmatch "confrontare due varianti") { throw "Corpo GitHub Issue non contiene il feedback." }
            if ($captured.payload.body -match "token-da-non-inviare") { throw "La query string della pagina non deve arrivare su GitHub." }

            # La prima richiesta valida ha consumato 1 slot; altre 4 devono riuscire.
            1..4 | ForEach-Object {
              $extra = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody
              if ($extra.StatusCode -ne 201) { throw "Feedback entro rate-limit deve restituire 201." }
            }

            $rateLimited = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($rateLimited.StatusCode -ne 429) { throw "Sesto feedback in 10 minuti: atteso 429, ricevuto $($rateLimited.StatusCode)." }
            if (-not $rateLimited.Headers["Retry-After"]) { throw "Risposta 429 priva di Retry-After." }

            Stop-ChildProcess $service
            $service = $null

            Remove-Item Env:TERMODEL_FEEDBACK_GITHUB_TOKEN -ErrorAction SilentlyContinue
            $service = Start-ServiceProcess

            $notConfigured = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($notConfigured.StatusCode -ne 503) { throw "Feedback senza token: atteso 503, ricevuto $($notConfigured.StatusCode)." }

            Write-Host "GITHUB_FEEDBACK_SMOKE_OK"
            Write-Host "issueNumber=$($created.issueNumber)"
          }
          finally {
            Stop-ChildProcess $service
            Stop-ChildProcess $stub
            if (Test-Path -LiteralPath $capture) { Remove-Item -LiteralPath $capture -Force }
            foreach ($logPath in @($serviceOut,$serviceErr,$stubOut,$stubErr)) {
              if ($logPath -and (Test-Path -LiteralPath $logPath)) { Remove-Item -LiteralPath $logPath -Force }
            }
          }

