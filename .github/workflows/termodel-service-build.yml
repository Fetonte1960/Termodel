      - name: Finalize Termodel job status and notify phone
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TERMODEL_NTFY_TOPIC: ${{ secrets.TERMODEL_NTFY_TOPIC }}
        run: |
          $ErrorActionPreference = "Continue"
          $finalStatus = if ("${{ job.status }}" -eq "success") { "SUCCESS" } else { "FAILED" }
          $githubState = if ($finalStatus -eq "SUCCESS") { "success" } else { "failure" }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          try {
            $headers = @{
              "Authorization" = "Bearer $env:GH_TOKEN"
              "Accept" = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $body = @{
              state = $githubState
              context = "Termodel/job"
              description = "$finalStatus - TermodelService Build #${{ github.run_number }}"
              target_url = $runUrl
            } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
            Write-Host "TERMODEL_JOB_STATUS=$finalStatus"
          } catch {
            Write-Warning "Impossibile aggiornare il Commit Status GitHub: $($_.Exception.Message)"
          }

          if ([string]::IsNullOrWhiteSpace($env:TERMODEL_NTFY_TOPIC)) {
            Write-Warning "TERMODEL_NTFY_TOPIC non configurato: notifica telefono non inviata."
            exit 0
          }

          $topic = [uri]::EscapeDataString($env:TERMODEL_NTFY_TOPIC)
          $message = "TermodelService Build #${{ github.run_number }}: $finalStatus" + [Environment]::NewLine + "Commit: ${{ github.sha }}"
          $priority = if ($finalStatus -eq "SUCCESS") { "high" } else { "urgent" }
          $tags = if ($finalStatus -eq "SUCCESS") { "white_check_mark" } else { "rotating_light" }

          try {
            $notifyHeaders = @{
              "Title" = "Termodel"
              "Priority" = $priority
              "Tags" = $tags
              "Actions" = "view, Apri GitHub Action, $runUrl"
            }
            Invoke-RestMethod -Uri "https://ntfy.sh/$topic" -Method Post -Headers $notifyHeaders -ContentType "text/plain; charset=utf-8" -Body $message | Out-Null
            Write-Host "PHONE_NOTIFICATION_SENT status=$finalStatus"
          } catch {
            Write-Warning "Notifica telefono non inviata: $($_.Exception.Message)"
          }
