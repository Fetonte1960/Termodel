name: TermodelService Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Termodel.WebService.sln

      - name: Build
        run: dotnet build Termodel.WebService.sln --configuration Release --no-restore
      - name: Smoke test HTTP legacy and calculation snapshot
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5080"
          $env:TERMODEL_SAVED_PROJECTS_DIR = Join-Path $env:RUNNER_TEMP ("TermodelSavedProjects-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $env:TERMODEL_SAVED_PROJECTS_DIR -Force | Out-Null

          $service = Start-Process dotnet -ArgumentList @(
            "run",
            "--project", "src/Termodel.WebService/Termodel.WebService.csproj",
            "--configuration", "Release",
            "--no-build",
            "--no-launch-profile"
          ) -PassThru

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5080/health" -Method Get
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $ready) {
              throw "Termodel.WebService non ha risposto a /health."
            }

            $project = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/projects/new" -Method Post -ContentType "application/json" -Body "{}"

            # Endpoint legacy mantenuto compatibile.
            $legacyModel = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/model/3d" -Method Post -ContentType "text/plain; charset=utf-8" -Body $project
            if ($legacyModel.format -ne "TermodelWebModel") { throw "Formato legacy model3d inatteso: $($legacyModel.format)" }
            if ($legacyModel.version -ne 3) { throw "Versione legacy model3d inattesa: $($legacyModel.version)" }
            if ($legacyModel.coordinateSystem -ne "Z-up") { throw "Sistema coordinate legacy inatteso: $($legacyModel.coordinateSystem)" }
            if ($legacyModel.primitiveCount -ne 0) { throw "Il ProgettoVuoto legacy deve produrre 0 primitive, ottenute: $($legacyModel.primitiveCount)" }

            # Nuovo ciclo AggiornaCalcolo.
            $calculation = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body $project
            if ($calculation.contractVersion -ne "TERMODEL-FRONT-SERVICE-V1") { throw "Contract version inattesa: $($calculation.contractVersion)" }
            if ($calculation.status -ne "completed") { throw "Stato calcolo inatteso: $($calculation.status)" }
            if (-not $calculation.calculationId) { throw "calculationId mancante." }
            if (-not $calculation.savedProject.fileName) { throw "savedProject.fileName mancante." }
            if ($calculation.savedProject.fileName -notlike "*$($calculation.calculationId)*") {
              throw "Il nome del progetto salvato non contiene calculationId."
            }

            $savedProjectPath = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR $calculation.savedProject.fileName
            if (-not (Test-Path -LiteralPath $savedProjectPath -PathType Leaf)) {
              throw "Il progetto salvato non esiste su disco: $savedProjectPath"
            }

            $savedProjectText = [System.IO.File]::ReadAllText(
              $savedProjectPath,
              [System.Text.UTF8Encoding]::new($false)
            )
            if ($savedProjectText -cne [string]$project) {
              throw "Il contenuto del progetto salvato differisce dal projectText ricevuto."
            }
            if (-not $savedProjectText.StartsWith("[TERMODEL-PROJECT-TEXT-V1]")) {
              throw "Il progetto salvato non contiene TERMODEL-PROJECT-TEXT-V1."
            }

            $artifact = @($calculation.artifacts | Where-Object { $_.name -eq "model3d" })
            if ($artifact.Count -ne 1) { throw "Manifest model3d non valido." }
            if ($artifact[0].contentType -ne "application/json") { throw "Content-Type manifest model3d inatteso: $($artifact[0].contentType)" }

            $artifactUrl = "http://127.0.0.1:5080$($artifact[0].href)"
            $firstResponse = Invoke-WebRequest -Uri $artifactUrl -Method Get
            $secondResponse = Invoke-WebRequest -Uri $artifactUrl -Method Get

            if ($firstResponse.Content -ne $secondResponse.Content) {
              throw "Lo stesso calculationId non ha restituito lo stesso snapshot model3d."
            }

            $snapshotModel = $firstResponse.Content | ConvertFrom-Json
            if ($snapshotModel.format -ne "TermodelWebModel") { throw "Formato snapshot model3d inatteso: $($snapshotModel.format)" }
            if ($snapshotModel.version -ne 3) { throw "Versione snapshot model3d inattesa: $($snapshotModel.version)" }
            if ($snapshotModel.coordinateSystem -ne "Z-up") { throw "Sistema coordinate snapshot inatteso: $($snapshotModel.coordinateSystem)" }
            if ($snapshotModel.primitiveCount -ne 0) { throw "Il ProgettoVuoto snapshot deve produrre 0 primitive, ottenute: $($snapshotModel.primitiveCount)" }

            # Due richieste riuscite devono produrre due calculationId e due file distinti.
            $calculation2 = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body $project
            if (-not $calculation2.calculationId) { throw "Secondo calculationId mancante." }
            if ($calculation2.calculationId -eq $calculation.calculationId) { throw "Due calcoli hanno restituito lo stesso calculationId." }
            if (-not $calculation2.savedProject.fileName) { throw "Secondo savedProject.fileName mancante." }
            if ($calculation2.savedProject.fileName -eq $calculation.savedProject.fileName) { throw "Due calcoli hanno prodotto lo stesso file progetto." }
            if ($calculation2.savedProject.fileName -notlike "*$($calculation2.calculationId)*") {
              throw "Il secondo nome progetto non contiene calculationId."
            }

            $savedProjectPath2 = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR $calculation2.savedProject.fileName
            if (-not (Test-Path -LiteralPath $savedProjectPath2 -PathType Leaf)) {
              throw "Il secondo progetto salvato non esiste su disco."
            }
            if ([System.IO.File]::ReadAllText($savedProjectPath2, [System.Text.UTF8Encoding]::new($false)) -cne [string]$project) {
              throw "Il contenuto del secondo progetto salvato differisce dal projectText."
            }

            # Una richiesta non valida non deve creare un progetto consolidabile.
            $countBeforeInvalid = @(Get-ChildItem -LiteralPath $env:TERMODEL_SAVED_PROJECTS_DIR -Filter "*.tmdl" -File).Count
            $invalidResponse = Invoke-WebRequest -Uri "http://127.0.0.1:5080/api/calculations" -Method Post -ContentType "text/plain; charset=utf-8" -Body "not-a-termodel-project" -SkipHttpErrorCheck
            if ($invalidResponse.StatusCode -ne 422) {
              throw "Una richiesta non valida deve restituire 422, ottenuto: $($invalidResponse.StatusCode)"
            }
            $countAfterInvalid = @(Get-ChildItem -LiteralPath $env:TERMODEL_SAVED_PROJECTS_DIR -Filter "*.tmdl" -File).Count
            if ($countAfterInvalid -ne $countBeforeInvalid) {
              throw "La richiesta non valida ha creato un file progetto."
            }
          }
          finally {
            if ($service -and -not $service.HasExited) {
              Stop-Process -Id $service.Id -Force
            }
            if ($env:TERMODEL_SAVED_PROJECTS_DIR -and (Test-Path -LiteralPath $env:TERMODEL_SAVED_PROJECTS_DIR)) {
              Remove-Item -LiteralPath $env:TERMODEL_SAVED_PROJECTS_DIR -Recurse -Force
            }
          }
