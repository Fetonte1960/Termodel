name: TermodelService Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Termodel.WebService.sln

      - name: Build
        run: dotnet build Termodel.WebService.sln --configuration Release --no-restore
      - name: Smoke test HTTP project to model3d
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://127.0.0.1:5080"
          $service = Start-Process dotnet -ArgumentList @(
            "run",
            "--project", "src/Termodel.WebService/Termodel.WebService.csproj",
            "--configuration", "Release",
            "--no-build",
            "--no-launch-profile"
          ) -PassThru

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5080/health" -Method Get
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $ready) {
              throw "Termodel.WebService non ha risposto a /health."
            }

            $project = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/projects/new" -Method Post -ContentType "application/json" -Body "{}"
            $model = Invoke-RestMethod -Uri "http://127.0.0.1:5080/api/model/3d" -Method Post -ContentType "text/plain; charset=utf-8" -Body $project

            if ($model.format -ne "TermodelWebModel") { throw "Formato model3d inatteso: $($model.format)" }
            if ($model.version -ne 3) { throw "Versione model3d inattesa: $($model.version)" }
            if ($model.coordinateSystem -ne "Z-up") { throw "Sistema coordinate inatteso: $($model.coordinateSystem)" }
            if ($model.primitiveCount -ne 0) { throw "Il ProgettoVuoto deve produrre 0 primitive, ottenute: $($model.primitiveCount)" }
          }
          finally {
            if ($service -and -not $service.HasExited) {
              Stop-Process -Id $service.Id -Force
            }
          }
