name: TermodelService Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Termodel.WebService.sln

      - name: Build
        run: dotnet build Termodel.WebService.sln --configuration Release --no-restore
      - name: Smoke test HTTP project storage and exclusive locks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5080"
          $env:ASPNETCORE_URLS = $base
          $env:TERMODEL_PROJECT_LOCK_LEASE_SECONDS = "15"
          $env:TERMODEL_SAVED_PROJECTS_DIR = Join-Path $env:RUNNER_TEMP ("TermodelSavedProjects-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $env:TERMODEL_SAVED_PROJECTS_DIR -Force | Out-Null

          function Start-ServiceProcess {
            $p = Start-Process dotnet -ArgumentList @("run","--project","src/Termodel.WebService/Termodel.WebService.csproj","--configuration","Release","--no-build","--no-launch-profile") -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-RestMethod -Uri "$base/health" -Method Get).status -eq "ok") { return $p }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Termodel.WebService non ha risposto a /health."
          }

          function Stop-ServiceProcess($p) {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit(5000) | Out-Null
            }
          }

          function Set-ProjectManifest([string]$projectText,[string]$projectId,[string]$projectName) {
            $crlf = ([string][char]13)+([string][char]10)
            $normalized = $projectText.Replace($crlf,[string][char]10).Replace([string][char]13,[string][char]10)
            $begin = "---BEGIN:manifest.json---"; $end = "---END:manifest.json---"
            $bi = $normalized.IndexOf($begin,[System.StringComparison]::Ordinal)
            $cs = $bi + $begin.Length
            if ($normalized[$cs] -eq [char]10) { $cs++ }
            $ei = $normalized.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
            $manifest = $normalized.Substring($cs,$ei-$cs).TrimEnd([char]10) | ConvertFrom-Json
            $manifest | Add-Member -NotePropertyName projectId -NotePropertyValue $projectId -Force
            $manifest.projectName = $projectName
            $json = $manifest | ConvertTo-Json -Depth 100
            return $normalized.Substring(0,$cs)+$json+[char]10+$normalized.Substring($ei)
          }

          function LockHeaders([string]$token) {
            return @{ "X-Termodel-Project-Lock" = $token }
          }

          $service = $null
          try {
            $service = Start-ServiceProcess

            $baseProject = Invoke-RestMethod -Uri "$base/api/projects/new" -Method Post -ContentType "application/json" -Body "{}"

            foreach ($requiredSection in @(
              "definition/pannelli-tubazioni-definizionedati.json",
              "archives/json/TipologiePannelli.json",
              "archives/json/Tubazioni.json",
              "archives/json/Fluidi.json",
              "archives/xml/TipologiePannelli.xml",
              "archives/xml/Tubazioni.xml",
              "archives/xml/Fluidi.xml"
            )) {
              if ($baseProject -notmatch [regex]::Escape("---BEGIN:$requiredSection---")) {
                throw "Progetto nuovo privo della sezione pannelli/tubazioni obbligatoria: $requiredSection"
              }
            }

            function Read-ProjectJsonSection([string]$projectText,[string]$sectionName) {
              $begin = "---BEGIN:$sectionName---"
              $end = "---END:$sectionName---"
              $bi = $projectText.IndexOf($begin,[System.StringComparison]::Ordinal)
              if ($bi -lt 0) { throw "Sezione $sectionName non trovata." }
              $cs = $bi + $begin.Length
              while ($cs -lt $projectText.Length -and ($projectText[$cs] -eq [char]13 -or $projectText[$cs] -eq [char]10)) { $cs++ }
              $ei = $projectText.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
              if ($ei -lt 0) { throw "Sezione $sectionName non chiusa." }
              return $projectText.Substring($cs,$ei-$cs).Trim() | ConvertFrom-Json
            }

            $tipologiePannelli = @(Read-ProjectJsonSection $baseProject "archives/json/TipologiePannelli.json")
            $tubazioni = @(Read-ProjectJsonSection $baseProject "archives/json/Tubazioni.json")
            $fluidi = @(Read-ProjectJsonSection $baseProject "archives/json/Fluidi.json")
            if ($tipologiePannelli.Count -lt 1) { throw "TipologiePannelli non precompilato." }
            if ($tipologiePannelli[0].CasaProduttrice -ne "Generico" -or $tipologiePannelli[0].Modello -ne "Default Termodel") { throw "Tipologia pannello default inattesa." }
            if ($tipologiePannelli[0].PassoTubiM -ne 0.3 -or $tipologiePannelli[0].PerditaCaricoMassimaCircuitoPa -ne 25000) { throw "Default pannelli non coerenti con CalcoloPannelli." }
            if ($tubazioni.Count -lt 1 -or $tubazioni[0].Codice -ne "PEXA-O2-16X2" -or $tubazioni[0].DiametroInternoMm -ne 12) { throw "Tubazione radiante default inattesa." }
            if ($fluidi.Count -ne 3 -or @($fluidi | Where-Object { $_.Codice -eq "H2O" }).Count -ne 3) { throw "Archivio acqua non contiene i tre punti temperatura attesi." }

            $frontEmptyProjectPath = Join-Path $PWD "..\..\SorgentiTermodel\Library\projects\ProgettoVuoto\ProgettoVuoto.termodel.txt"
            $frontEmptyProject = [System.IO.File]::ReadAllText($frontEmptyProjectPath,[System.Text.UTF8Encoding]::new($false))
            foreach ($archiveName in @("TipologiePannelli","Tubazioni","Fluidi")) {
              if ($frontEmptyProject -notmatch [regex]::Escape("---BEGIN:archives/json/$archiveName.json---")) {
                throw "ProgettoVuoto frontend privo dell'archivio $archiveName."
              }
            }
            Write-Host "RADIANT_PROJECT_ARCHIVES_SMOKE_OK"

            $legacy = Invoke-RestMethod -Uri "$base/api/model/3d" -Method Post -ContentType "text/plain; charset=utf-8" -Body $baseProject
            if ($legacy.format -ne "TermodelWebModel" -or $legacy.version -ne 3) { throw "Endpoint legacy model3d non compatibile." }

            $allocA = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            $allocB = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            if ($allocA.projectId -eq $allocB.projectId) { throw "projectId duplicati." }
            if (-not $allocA.projectLockToken -or -not $allocB.projectLockToken) { throw "Lock token iniziale mancante." }

            $projectA = Set-ProjectManifest $baseProject ([string]$allocA.projectId) "Progetto A"
            $projectB = Set-ProjectManifest $baseProject ([string]$allocB.projectId) "Progetto B"
            $headersA = LockHeaders ([string]$allocA.projectLockToken)
            $headersB = LockHeaders ([string]$allocB.projectLockToken)

            $saveA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/save" -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            $saveB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/save" -Method Put -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if (-not $saveA.artifactsStale -or -not $saveB.artifactsStale) { throw "Il primo salvataggio deve marcare gli artifact stale." }

            $dirA = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocA.projectId)
            $dirB = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocB.projectId)
            if (-not (Test-Path (Join-Path $dirA "project.tmdl")) -or -not (Test-Path (Join-Path $dirB "project.tmdl"))) { throw "project.tmdl non persistito nelle cartelle progetto." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null
            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            $secondOpen = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post -SkipHttpErrorCheck
            if ($secondOpen.StatusCode -ne 423) { throw "La doppia apertura dello stesso progetto deve restituire 423." }

            $openB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/open" -Method Post
            $headersB = LockHeaders ([string]$openB.projectLockToken
            )
            if ($openB.projectId -ne $allocB.projectId) { throw "Apertura contemporanea del progetto B fallita." }

            $badHeaders = LockHeaders ([guid]::NewGuid().ToString("D"))
            $badCalc = Invoke-WebRequest -Uri "$base/api/calculations" -Method Post -Headers $badHeaders -ContentType "text/plain; charset=utf-8" -Body $projectA -SkipHttpErrorCheck
            if ($badCalc.StatusCode -ne 423) { throw "Aggiorna Modello con lock errato deve restituire 423." }

            $calcA = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($calcA.projectId -ne $allocA.projectId -or $calcA.PSObject.Properties["calculationId"]) { throw "Response calcolo A non valida." }

            $termodelLogPathA = Join-Path $dirA "logs\TermodelLog.md"
            $diagnosticsPathA = Join-Path $dirA "logs\diagnostics.txt"
            if (-not (Test-Path $termodelLogPathA)) { throw "TermodelLog.md non persistito nel workspace del progetto." }
            if (-not (Test-Path $diagnosticsPathA)) { throw "diagnostics.txt non persistito." }

            $termodelLogFileA = [System.IO.File]::ReadAllText($termodelLogPathA,[System.Text.UTF8Encoding]::new($false))
            $diagnosticsFileA = [System.IO.File]::ReadAllText($diagnosticsPathA,[System.Text.UTF8Encoding]::new($false))
            if ([string]::IsNullOrWhiteSpace($termodelLogFileA)) { throw "TermodelLog.md esiste ma non contiene messaggi: logging Core non attivo." }
            if ($termodelLogFileA -ne $diagnosticsFileA) { throw "TermodelLog.md e diagnostics.txt devono rappresentare lo stesso log Core corrente." }

            $termodelLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($termodelLogResponse.StatusCode -ne 200) { throw "GET TermodelLog deve restituire 200." }
            if ($termodelLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "TermodelLog appena calcolato marcato stale." }
            if ($termodelLogResponse.Headers["Content-Type"] -notmatch "^text/markdown") { throw "Content-Type TermodelLog inatteso." }
            if ($termodelLogResponse.Content -ne $termodelLogFileA) { throw "GET TermodelLog non restituisce il file persistito byte/logicamente identico." }

            $missingLogId = [guid]::NewGuid().ToString("D")
            $missingLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$missingLogId/logs/termodel" -Method Get -SkipHttpErrorCheck
            if ($missingLogResponse.StatusCode -ne 404) { throw "TermodelLog inesistente deve restituire 404." }

            $logHashBeforeFailure = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            $invalidProjectA = $projectA.Replace('data-termodel-units="cm"', 'data-termodel-units="invalid"')
            if ($invalidProjectA -eq $projectA) { throw "Smoke non ha trovato l'attributo SVG da invalidare." }
            $failedCalc = Invoke-WebRequest -Uri "$base/api/calculations" -Method Post -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $invalidProjectA -SkipHttpErrorCheck
            if ($failedCalc.StatusCode -ne 422) { throw "Calcolo volutamente non valido deve restituire 422." }
            $logHashAfterFailure = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            if ($logHashBeforeFailure -ne $logHashAfterFailure) { throw "Un calcolo fallito ha sostituito il TermodelLog dell'ultimo calcolo valido." }

            $modelResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($modelResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "Artifact appena calcolato marcato stale." }

            # Configurazione logging per singola elaborazione sul progetto B.
            $logAHashBeforeB = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash

            $calcBDisabled = Invoke-RestMethod -Uri "$base/api/calculations?logEnabled=false" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBDisabled.logging.enabled -ne $false -or $calcBDisabled.logging.mode -ne "disabled") { throw "logEnabled=false non applicato." }
            if (@($calcBDisabled.diagnostics).Count -ne 0) { throw "Logging disabilitato deve produrre zero diagnostiche." }

            $termodelLogPathB = Join-Path $dirB "logs\TermodelLog.md"
            $calculationLogPathB = Join-Path $dirB "logs\calculation.log"
            if (-not (Test-Path $termodelLogPathB)) { throw "TermodelLog B non persistito con logging disabilitato." }
            if ((Get-Content -LiteralPath $termodelLogPathB -Raw).Length -ne 0) { throw "TermodelLog B deve essere vuoto con logEnabled=false." }
            $calcMetaDisabled = Get-Content -LiteralPath $calculationLogPathB -Raw
            if ($calcMetaDisabled -notmatch "logEnabled=false" -or $calcMetaDisabled -notmatch "logMode=disabled") { throw "calculation.log non registra logging disabilitato." }

            $calcBError = Invoke-RestMethod -Uri "$base/api/calculations?logCategories=Error" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBError.logging.enabled -ne $true -or $calcBError.logging.mode -ne "filtered") { throw "Filtro log Error non applicato." }
            if (@($calcBError.logging.categories).Count -ne 1 -or $calcBError.logging.categories[0] -ne "Error") { throw "Categoria Error non riportata correttamente." }
            $errorOnlyLog = Get-Content -LiteralPath $termodelLogPathB -Raw
            if ($errorOnlyLog -notmatch "(?m)^error:") { throw "Filtro Error non ha conservato il messaggio di errore atteso." }
            if ($errorOnlyLog -match "(?m)^operation:" -or $errorOnlyLog -match "(?m)^info:") { throw "Filtro Error ha lasciato passare categorie non richieste." }

            $calcBAll = Invoke-RestMethod -Uri "$base/api/calculations?logCategories=all" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if ($calcBAll.logging.mode -ne "filtered" -or @($calcBAll.logging.categories).Count -ne 9) { throw "logCategories=all non abilita tutte le 9 categorie Desktop." }
            $allLog = Get-Content -LiteralPath $termodelLogPathB -Raw
            if ([string]::IsNullOrWhiteSpace($allLog)) { throw "logCategories=all deve produrre un log non vuoto." }
            $calcMetaAll = Get-Content -LiteralPath $calculationLogPathB -Raw
            if ($calcMetaAll -notmatch "logMode=filtered" -or $calcMetaAll -notmatch "PontiAutomatici") { throw "calculation.log non registra le categorie abilitate." }

            $logBHashBeforeInvalid = (Get-FileHash -LiteralPath $termodelLogPathB -Algorithm SHA256).Hash
            $invalidLogConfig = Invoke-WebRequest -Uri "$base/api/calculations?logCategories=colmi,inesistente" -Method Post -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB -SkipHttpErrorCheck
            if ($invalidLogConfig.StatusCode -ne 400) { throw "Categoria log sconosciuta deve restituire 400." }
            $logBHashAfterInvalid = (Get-FileHash -LiteralPath $termodelLogPathB -Algorithm SHA256).Hash
            if ($logBHashBeforeInvalid -ne $logBHashAfterInvalid) { throw "Configurazione log invalida ha modificato il log valido precedente." }

            $logAHashAfterB = (Get-FileHash -LiteralPath $termodelLogPathA -Algorithm SHA256).Hash
            if ($logAHashBeforeB -ne $logAHashAfterB) { throw "Le configurazioni log del progetto B hanno contaminato il log del progetto A." }

            $renamed = "Progetto A Rinominato"
            $saveAsUrl = "$base/api/projects/$($allocA.projectId)/save-as?projectName=$([uri]::EscapeDataString($renamed))"
            $saveAs = Invoke-RestMethod -Uri $saveAsUrl -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($saveAs.projectId -ne $allocA.projectId -or $saveAs.projectName -ne $renamed) { throw "Salva con nome ha cambiato projectId o nome errato." }

            $savedText = [System.IO.File]::ReadAllText((Join-Path $dirA "project.tmdl"),[System.Text.UTF8Encoding]::new($false))
            if ($savedText -notmatch [regex]::Escape([string]$allocA.projectId) -or $savedText -notmatch [regex]::Escape($renamed)) { throw "project.tmdl rinominato non conserva projectId/nome." }

            $staleResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($staleResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Salva con nome deve rendere stale gli artifact." }

            $staleLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($staleLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Salva con nome deve rendere stale anche il TermodelLog corrente." }

            $heartbeat = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/heartbeat" -Method Post -Headers $headersA
            if ($heartbeat.status -ne "locked") { throw "Heartbeat lock fallito." }

            $unlockNeedsConfirm = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/unlock" -Method Post -SkipHttpErrorCheck
            if ($unlockNeedsConfirm.StatusCode -ne 409) { throw "Sblocco di lock vivo senza force deve richiedere conferma 409." }
            $forcedUnlock = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/unlock?force=true" -Method Post
            if ($forcedUnlock.status -ne "unlocked") { throw "Sblocco forzato fallito." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            Start-Sleep -Seconds 16
            $openAfterExpiry = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openAfterExpiry.projectLockToken)

            $list = Invoke-RestMethod -Uri "$base/api/projects" -Method Get
            if (@($list.projects).Count -ne 2) { throw "Elenco progetti non contiene A e B." }

            # Simula crash: lascia A aperto, termina il Service senza close e riavvia.
            Stop-ServiceProcess $service
            $service = $null
            $service = Start-ServiceProcess

            $recoveredA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$recoveredA.projectLockToken)
            if ($recoveredA.projectName -ne $renamed) { throw "Recovery dopo restart non ha riaperto il progetto rinominato." }

            $restartedLogResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/logs/termodel" -Method Get
            if ($restartedLogResponse.StatusCode -ne 200) { throw "TermodelLog non leggibile dopo restart Service." }
            if ($restartedLogResponse.Content -ne $termodelLogFileA) { throw "TermodelLog cambiato dopo restart Service." }
            if ($restartedLogResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Dopo Salva con nome/restart il TermodelLog deve restare stale." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null

            Write-Host "TERMODEL_LOG_OPTIONS_SMOKE_OK"
            Write-Host "TERMODEL_LOG_SMOKE_OK"
            Write-Host "PROJECT_LOCK_SMOKE_OK"
            Write-Host "projectIdA=$($allocA.projectId)"
            Write-Host "projectIdB=$($allocB.projectId)"
          }
          finally {
            Stop-ServiceProcess $service
            if ($env:TERMODEL_SAVED_PROJECTS_DIR -and (Test-Path $env:TERMODEL_SAVED_PROJECTS_DIR)) {
              Remove-Item $env:TERMODEL_SAVED_PROJECTS_DIR -Recurse -Force
            }
          }


      - name: Smoke test GitHub feedback bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5081"
          $capture = Join-Path $env:RUNNER_TEMP "termodel-feedback-capture.json"
          $serviceOut = Join-Path $env:RUNNER_TEMP "termodel-feedback-service.out.log"
          $serviceErr = Join-Path $env:RUNNER_TEMP "termodel-feedback-service.err.log"
          $stubOut = Join-Path $env:RUNNER_TEMP "termodel-feedback-stub.out.log"
          $stubErr = Join-Path $env:RUNNER_TEMP "termodel-feedback-stub.err.log"
          $env:ASPNETCORE_URLS = $base
          $env:TERMODEL_FEEDBACK_GITHUB_TOKEN = "test-token"
          $env:TERMODEL_FEEDBACK_REPOSITORY = "Fetonte1960/Termodel"
          $env:TERMODEL_FEEDBACK_ALLOWED_ORIGIN = "https://www.termodel.it"
          $env:TERMODEL_FEEDBACK_GITHUB_API_BASE_URL = "http://127.0.0.1:5099"

          function Start-ServiceProcess {
            $p = Start-Process dotnet -ArgumentList @("run","--project","src/Termodel.WebService/Termodel.WebService.csproj","--configuration","Release","--no-build","--no-launch-profile") -RedirectStandardOutput $serviceOut -RedirectStandardError $serviceErr -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-RestMethod -Uri "$base/health" -Method Get).status -eq "ok") { return $p }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Termodel.WebService feedback smoke non ha risposto a /health."
          }

          function Stop-ChildProcess($p) {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit(5000) | Out-Null
            }
          }

          $stub = $null
          $service = $null

          try {
            $stub = Start-Process python -ArgumentList @("tests/github_feedback_stub.py",$capture) -RedirectStandardOutput $stubOut -RedirectStandardError $stubErr -PassThru

            $probeBody = '{"title":"probe","body":"probe"}'
            $probe = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if ($stub.HasExited) {
                if (Test-Path $stubErr) { Get-Content $stubErr | Write-Host }
                throw "Stub GitHub non avviato."
              }

              try {
                $probe = Invoke-WebRequest -Uri "http://127.0.0.1:5099/repos/Fetonte1960/Termodel/issues" -Method Post -Headers @{ Authorization = "Bearer test-token" } -ContentType "application/json" -Body $probeBody -SkipHttpErrorCheck
                if ($probe.StatusCode -eq 201) { break }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }

            if (-not $probe -or $probe.StatusCode -ne 201) {
              if (Test-Path $stubErr) { Get-Content $stubErr | Write-Host }
              throw "Stub GitHub non raggiungibile entro il timeout di avvio."
            }
            Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue

            $service = Start-ServiceProcess

            $validBody = @{
              message = "Vorrei un comando per confrontare due varianti del progetto."
              category = "suggestion"
              title = "Confronto varianti"
              page = "/termodel-ui-demo/?token-da-non-inviare=123"
              appVersion = "0.98"
            } | ConvertTo-Json

            $badOrigin = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://evil.example" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($badOrigin.StatusCode -ne 403) { throw "Origine feedback non autorizzata: atteso 403, ricevuto $($badOrigin.StatusCode)." }

            $invalidBody = @{ message = "x"; category = "invalid" } | ConvertTo-Json
            $invalid = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $invalidBody -SkipHttpErrorCheck
            if ($invalid.StatusCode -ne 400) { throw "Payload feedback non valido: atteso 400, ricevuto $($invalid.StatusCode)." }

            $createdResponse = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($createdResponse.StatusCode -ne 201) {
              Write-Host "Feedback response: $($createdResponse.Content)"
              if (Test-Path $serviceOut) { Get-Content $serviceOut | Select-Object -Last 80 | Write-Host }
              if (Test-Path $serviceErr) { Get-Content $serviceErr | Select-Object -Last 80 | Write-Host }
              if (Test-Path $stubErr) { Get-Content $stubErr | Select-Object -Last 80 | Write-Host }
              throw "Creazione feedback: atteso 201, ricevuto $($createdResponse.StatusCode)."
            }

            $created = $createdResponse.Content | ConvertFrom-Json
            if ($created.status -ne "created" -or $created.issueNumber -ne 4242) { throw "Risposta feedback creata non valida." }

            if (-not (Test-Path -LiteralPath $capture)) { throw "Stub GitHub non ha ricevuto la richiesta issue." }
            $captured = Get-Content -LiteralPath $capture -Raw | ConvertFrom-Json

            if ($captured.path -ne "/repos/Fetonte1960/Termodel/issues") { throw "Path GitHub Issues inatteso: $($captured.path)" }
            if ($captured.authorization -ne "Bearer test-token") { throw "Authorization GitHub non corretta." }
            if ($captured.userAgent -notmatch "Termodel-WebService") { throw "User-Agent GitHub non corretto." }
            if ($captured.payload.title -notmatch "^\[Termodel Feedback/Suggestion\]") { throw "Titolo GitHub Issue inatteso." }
            if ($captured.payload.body -notmatch "confrontare due varianti") { throw "Corpo GitHub Issue non contiene il feedback." }
            if ($captured.payload.body -match "token-da-non-inviare") { throw "La query string della pagina non deve arrivare su GitHub." }

            # La prima richiesta valida ha consumato 1 slot; altre 4 devono riuscire.
            1..4 | ForEach-Object {
              $extra = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody
              if ($extra.StatusCode -ne 201) { throw "Feedback entro rate-limit deve restituire 201." }
            }

            $rateLimited = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($rateLimited.StatusCode -ne 429) { throw "Sesto feedback in 10 minuti: atteso 429, ricevuto $($rateLimited.StatusCode)." }
            if (-not $rateLimited.Headers["Retry-After"]) { throw "Risposta 429 priva di Retry-After." }

            Stop-ChildProcess $service
            $service = $null

            Remove-Item Env:TERMODEL_FEEDBACK_GITHUB_TOKEN -ErrorAction SilentlyContinue
            $service = Start-ServiceProcess

            $notConfigured = Invoke-WebRequest -Uri "$base/api/feedback" -Method Post -Headers @{ Origin = "https://www.termodel.it" } -ContentType "application/json" -Body $validBody -SkipHttpErrorCheck
            if ($notConfigured.StatusCode -ne 503) { throw "Feedback senza token: atteso 503, ricevuto $($notConfigured.StatusCode)." }

            Write-Host "GITHUB_FEEDBACK_SMOKE_OK"
            Write-Host "issueNumber=$($created.issueNumber)"
          }
          finally {
            Stop-ChildProcess $service
            Stop-ChildProcess $stub
            if (Test-Path -LiteralPath $capture) { Remove-Item -LiteralPath $capture -Force }
            foreach ($logPath in @($serviceOut,$serviceErr,$stubOut,$stubErr)) {
              if ($logPath -and (Test-Path -LiteralPath $logPath)) { Remove-Item -LiteralPath $logPath -Force }
            }
          }
