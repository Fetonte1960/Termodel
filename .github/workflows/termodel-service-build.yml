name: TermodelService Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/**'
      - '.github/workflows/termodel-service-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Termodel.WebService.sln

      - name: Build
        run: dotnet build Termodel.WebService.sln --configuration Release --no-restore
      - name: Smoke test HTTP project storage and exclusive locks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "http://127.0.0.1:5080"
          $env:ASPNETCORE_URLS = $base
          $env:TERMODEL_PROJECT_LOCK_LEASE_SECONDS = "15"
          $env:TERMODEL_SAVED_PROJECTS_DIR = Join-Path $env:RUNNER_TEMP ("TermodelSavedProjects-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $env:TERMODEL_SAVED_PROJECTS_DIR -Force | Out-Null

          function Start-ServiceProcess {
            $p = Start-Process dotnet -ArgumentList @("run","--project","src/Termodel.WebService/Termodel.WebService.csproj","--configuration","Release","--no-build","--no-launch-profile") -PassThru
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-RestMethod -Uri "$base/health" -Method Get).status -eq "ok") { return $p }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Termodel.WebService non ha risposto a /health."
          }

          function Stop-ServiceProcess($p) {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              $p.WaitForExit(5000) | Out-Null
            }
          }

          function Set-ProjectManifest([string]$projectText,[string]$projectId,[string]$projectName) {
            $crlf = ([string][char]13)+([string][char]10)
            $normalized = $projectText.Replace($crlf,[string][char]10).Replace([string][char]13,[string][char]10)
            $begin = "---BEGIN:manifest.json---"; $end = "---END:manifest.json---"
            $bi = $normalized.IndexOf($begin,[System.StringComparison]::Ordinal)
            $cs = $bi + $begin.Length
            if ($normalized[$cs] -eq [char]10) { $cs++ }
            $ei = $normalized.IndexOf($end,$cs,[System.StringComparison]::Ordinal)
            $manifest = $normalized.Substring($cs,$ei-$cs).TrimEnd([char]10) | ConvertFrom-Json
            $manifest | Add-Member -NotePropertyName projectId -NotePropertyValue $projectId -Force
            $manifest.projectName = $projectName
            $json = $manifest | ConvertTo-Json -Depth 100
            return $normalized.Substring(0,$cs)+$json+[char]10+$normalized.Substring($ei)
          }

          function LockHeaders([string]$token) {
            return @{ "X-Termodel-Project-Lock" = $token }
          }

          $service = $null
          try {
            $service = Start-ServiceProcess

            $baseProject = Invoke-RestMethod -Uri "$base/api/projects/new" -Method Post -ContentType "application/json" -Body "{}"
            $legacy = Invoke-RestMethod -Uri "$base/api/model/3d" -Method Post -ContentType "text/plain; charset=utf-8" -Body $baseProject
            if ($legacy.format -ne "TermodelWebModel" -or $legacy.version -ne 3) { throw "Endpoint legacy model3d non compatibile." }

            $allocA = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            $allocB = Invoke-RestMethod -Uri "$base/api/projects/allocate-id" -Method Post
            if ($allocA.projectId -eq $allocB.projectId) { throw "projectId duplicati." }
            if (-not $allocA.projectLockToken -or -not $allocB.projectLockToken) { throw "Lock token iniziale mancante." }

            $projectA = Set-ProjectManifest $baseProject ([string]$allocA.projectId) "Progetto A"
            $projectB = Set-ProjectManifest $baseProject ([string]$allocB.projectId) "Progetto B"
            $headersA = LockHeaders ([string]$allocA.projectLockToken)
            $headersB = LockHeaders ([string]$allocB.projectLockToken)

            $saveA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/save" -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            $saveB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/save" -Method Put -Headers $headersB -ContentType "text/plain; charset=utf-8" -Body $projectB
            if (-not $saveA.artifactsStale -or -not $saveB.artifactsStale) { throw "Il primo salvataggio deve marcare gli artifact stale." }

            $dirA = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocA.projectId)
            $dirB = Join-Path $env:TERMODEL_SAVED_PROJECTS_DIR ([string]$allocB.projectId)
            if (-not (Test-Path (Join-Path $dirA "project.tmdl")) -or -not (Test-Path (Join-Path $dirB "project.tmdl"))) { throw "project.tmdl non persistito nelle cartelle progetto." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null
            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            $secondOpen = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post -SkipHttpErrorCheck
            if ($secondOpen.StatusCode -ne 423) { throw "La doppia apertura dello stesso progetto deve restituire 423." }

            $openB = Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/open" -Method Post
            $headersB = LockHeaders ([string]$openB.projectLockToken
            )
            if ($openB.projectId -ne $allocB.projectId) { throw "Apertura contemporanea del progetto B fallita." }

            $badHeaders = LockHeaders ([guid]::NewGuid().ToString("D"))
            $badCalc = Invoke-WebRequest -Uri "$base/api/calculations" -Method Post -Headers $badHeaders -ContentType "text/plain; charset=utf-8" -Body $projectA -SkipHttpErrorCheck
            if ($badCalc.StatusCode -ne 423) { throw "Aggiorna Modello con lock errato deve restituire 423." }

            $calcA = Invoke-RestMethod -Uri "$base/api/calculations" -Method Post -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($calcA.projectId -ne $allocA.projectId -or $calcA.PSObject.Properties["calculationId"]) { throw "Response calcolo A non valida." }

            $modelResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($modelResponse.Headers["X-Termodel-Artifact-Stale"] -ne "false") { throw "Artifact appena calcolato marcato stale." }

            $renamed = "Progetto A Rinominato"
            $saveAsUrl = "$base/api/projects/$($allocA.projectId)/save-as?projectName=$([uri]::EscapeDataString($renamed))"
            $saveAs = Invoke-RestMethod -Uri $saveAsUrl -Method Put -Headers $headersA -ContentType "text/plain; charset=utf-8" -Body $projectA
            if ($saveAs.projectId -ne $allocA.projectId -or $saveAs.projectName -ne $renamed) { throw "Salva con nome ha cambiato projectId o nome errato." }

            $savedText = [System.IO.File]::ReadAllText((Join-Path $dirA "project.tmdl"),[System.Text.UTF8Encoding]::new($false))
            if ($savedText -notmatch [regex]::Escape([string]$allocA.projectId) -or $savedText -notmatch [regex]::Escape($renamed)) { throw "project.tmdl rinominato non conserva projectId/nome." }

            $staleResponse = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/artifacts/model3d" -Method Get
            if ($staleResponse.Headers["X-Termodel-Artifact-Stale"] -ne "true") { throw "Salva con nome deve rendere stale gli artifact." }

            $heartbeat = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/heartbeat" -Method Post -Headers $headersA
            if ($heartbeat.status -ne "locked") { throw "Heartbeat lock fallito." }

            $unlockNeedsConfirm = Invoke-WebRequest -Uri "$base/api/projects/$($allocA.projectId)/unlock" -Method Post -SkipHttpErrorCheck
            if ($unlockNeedsConfirm.StatusCode -ne 409) { throw "Sblocco di lock vivo senza force deve richiedere conferma 409." }
            $forcedUnlock = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/unlock?force=true" -Method Post
            if ($forcedUnlock.status -ne "unlocked") { throw "Sblocco forzato fallito." }

            $openA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openA.projectLockToken)
            Start-Sleep -Seconds 16
            $openAfterExpiry = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$openAfterExpiry.projectLockToken)

            $list = Invoke-RestMethod -Uri "$base/api/projects" -Method Get
            if (@($list.projects).Count -ne 2) { throw "Elenco progetti non contiene A e B." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocB.projectId)/close" -Method Post -Headers $headersB | Out-Null

            # Simula crash: lascia A aperto, termina il Service senza close e riavvia.
            Stop-ServiceProcess $service
            $service = $null
            $service = Start-ServiceProcess

            $recoveredA = Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/open" -Method Post
            $headersA = LockHeaders ([string]$recoveredA.projectLockToken)
            if ($recoveredA.projectName -ne $renamed) { throw "Recovery dopo restart non ha riaperto il progetto rinominato." }

            Invoke-RestMethod -Uri "$base/api/projects/$($allocA.projectId)/close" -Method Post -Headers $headersA | Out-Null

            Write-Host "PROJECT_LOCK_SMOKE_OK"
            Write-Host "projectIdA=$($allocA.projectId)"
            Write-Host "projectIdB=$($allocB.projectId)"
          }
          finally {
            Stop-ServiceProcess $service
            if ($env:TERMODEL_SAVED_PROJECTS_DIR -and (Test-Path $env:TERMODEL_SAVED_PROJECTS_DIR)) {
              Remove-Item $env:TERMODEL_SAVED_PROJECTS_DIR -Recurse -Force
            }
          }
