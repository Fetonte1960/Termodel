name: Termodel Diego_Vittorio Fast Harness

permissions:
  contents: read
  statuses: write

concurrency:
  group: termodel-diego-vittorio-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/src/Termodel.Core/RadiantPanels/RadiantExecutiveGenerator.cs'
      - 'Server/Termodelwebservice/src/Termodel.Core/RadiantPanels/StrategiaDiegoVittorioBenchmark.cs'
      - 'Server/Termodelwebservice/src/Termodel.Core/CopiedFromTermodel/SpiraliDiegoVittorio/**'
      - 'Server/Termodelwebservice/tools/Termodel.RadiantPanels.Harness/**'
      - 'Server/Termodelwebservice/tests/radiant-harness/cases/*DIEGO-VITTORIO*.json'
      - 'Server/Termodelwebservice/tests/fixtures/StrategiaDiegoSquare4x4.locale.xml'
      - 'Server/Termodelwebservice/tests/fixtures/DiegoVittorioPublicSquareLeft.locale.xml'
      - 'Server/Termodelwebservice/tools/local-radiant-harness/Test-DiegoVittorio*.ps1'
      - '.github/workflows/termodel-diego-vittorio-fast.yml'

jobs:
  fast:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Termodel job RUNNING
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "pending"
            context = "Termodel/job"
            description = "RUNNING - Diego_Vittorio Fast #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Harness + Core
        run: dotnet restore tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj --nologo --verbosity:quiet

      - name: Build Harness + Core
        run: dotnet build tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-restore --nologo --verbosity:minimal -p:BuildInParallel=true

      - name: Run Diego_Vittorio square
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioFast"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Harness Diego_Vittorio fallito." }
          $svg = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.svg"
          $log = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.log.txt"
          $metrics = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.metrics.json"
          foreach ($required in @($svg,$log,$metrics)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Artifact fast mancante: $required" }
          }
          tools/local-radiant-harness/Test-DiegoVittorioDistances.ps1 -SvgPath $svg -StepMeters 0.30
          Write-Host "DIEGO_VITTORIO_FAST_SQUARE_OK"

      - name: Run public square left inlet regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPublicSquare"
          $caseId = "DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression quadrato pubblico Diego_Vittorio fallita." }

          $svg = Join-Path $out "$caseId.svg"
          $log = Join-Path $out "$caseId.log.txt"
          $metrics = Join-Path $out "$caseId.metrics.json"
          foreach ($required in @($svg,$log,$metrics)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Artifact regression mancante: $required" }
          }

          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -match 'Ritorno: offset 2 senza tratto percorribile') {
            throw "Regressione DV-TEST-001: offset 2 nuovamente bloccato."
          }
          if ($logText -match 'Ritorno: offset 3 senza collegamento valido') {
            throw "Regressione DV-TEST-001: offset 3 nuovamente bloccato."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=17') {
            throw "Regressione DV-TEST-001: Return non raggiunge i 17 punti attesi."
          }
          if ($logText -notmatch 'Chiusura rapida: tentativo=') {
            throw "Regressione DV-TEST-001: chiusura rapida non trovata."
          }

          $baselinePath = "tests/radiant-harness/baselines/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json"
          $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
          $actualSvgHash = (Get-FileHash -LiteralPath $svg -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSvgHash = ([string]$baseline.svgSha256).ToLowerInvariant()
          if ($actualSvgHash -ne $expectedSvgHash) {
            throw "VINCOLO QUADRATO BASE VIOLATO: SVG $actualSvgHash, atteso $expectedSvgHash."
          }
          $metricsObject = Get-Content -LiteralPath $metrics -Raw | ConvertFrom-Json
          if ([int]$metricsObject.SpiralPointCount -ne [int]$baseline.spiralPointCount) {
            throw "VINCOLO QUADRATO BASE VIOLATO: punti=$($metricsObject.SpiralPointCount), attesi=$($baseline.spiralPointCount)."
          }
          Write-Host "DIEGO_VITTORIO_APPROVED_SQUARE_BASELINE_OK"

          # Test-DiegoVittorioDistances.ps1 resta volutamente specifico del
          # quadrato sintetico 0..4 e viene già eseguito nello step precedente.
          # Questa regression verifica il difetto DV-TEST-001 sul vero input
          # pubblico, il completamento del Return e la chiusura.
          Write-Host "DIEGO_VITTORIO_PUBLIC_SQUARE_LEFT_OK"

      - name: Run fitting regression
        run: dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- fillet-check

      - name: Upload fast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diego-vittorio-fast
          path: |
            ${{ runner.temp }}/DiegoVittorioFast
            ${{ runner.temp }}/DiegoVittorioPublicSquare
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final status and notify
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.TERMODEL_NTFY_TOPIC }}
        run: |
          $jobStatus = "${{ job.status }}"
          $ok = $jobStatus -eq "success"
          $state = if ($ok) { "success" } else { "failure" }
          $label = if ($ok) { "SUCCESS" } else { "FAILED" }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "Termodel/job"
            description = "$label - Diego_Vittorio Fast #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($env:NTFY_TOPIC)) {
            try {
              $message = "Termodel Diego_Vittorio Fast #${{ github.run_number }} $label - ${{ github.sha }} - $runUrl"
              Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Headers @{
                "Title" = "Termodel Diego_Vittorio Fast"
                "Priority" = "low"
                "Tags" = if ($ok) { "white_check_mark" } else { "x" }
              } -Body $message | Out-Null
            } catch {
              Write-Warning "Notifica ntfy non riuscita: $($_.Exception.Message)"
            }
          }
