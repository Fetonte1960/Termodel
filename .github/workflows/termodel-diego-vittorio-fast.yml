name: Termodel Diego_Vittorio Fast Harness

permissions:
  contents: read
  statuses: write

concurrency:
  group: termodel-diego-vittorio-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  # Trigger esteso 01/10/2026: verifica anche il vero Generate Vittorio puro
  # usato da Vittorio_revisionato e i relativi gate.
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/termodel-diego-vittorio-fast.yml'
      - 'Server/Termodelwebservice/src/Termodel.Core/CopiedFromTermodel/SpiraliVittorioRevisionato/**'
      - 'Server/Termodelwebservice/src/Termodel.Core/RadiantPanels/StrategiaVittorioRevisionatoBenchmark.cs'
      - 'Server/Termodelwebservice/tools/Termodel.RadiantPanels.Harness/Program.cs'

jobs:
  fast:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Termodel job RUNNING
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "pending"
            context = "Termodel/job"
            description = "RUNNING - Diego_Vittorio Fast #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Harness + Core
        run: dotnet restore tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj --nologo --verbosity:quiet

      - name: Build Harness + Core
        run: dotnet build tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-restore --nologo --verbosity:minimal -p:BuildInParallel=true

      - name: Check ritorno parallelo Diego isolato
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- parallel-return-check
          if ($LASTEXITCODE -ne 0) { throw "Check ritorno parallelo Diego fallito." }

      - name: Check combinatoria consolidata funzioni_diego
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "src/Termodel.Core/CopiedFromTermodel/SpiraliDiegoVittorio/funzioni_diego.cs"
          $text = Get-Content -LiteralPath $path -Raw
          foreach ($marker in @(
            "(0, false)",
            "(0, true)",
            "(1, false)",
            "(1, true)",
            "(2, false)",
            "(2, true)",
            "lunghezzaMinimaChiusura = 2.0 * passo",
            "IntersecaTrattiNonAdiacentiChiusura",
            "type=first-straight-success"
          )) {
            if (-not $text.Contains($marker)) {
              throw "Combinatoria consolidata priva del marker: $marker"
            }
          }
          foreach ($forbidden in @(
            "preferisciTerminaleP",
            "CreaConfigurazioneTerminaleProiettata",
            "GeneraPrimaChiusuraAccettabile"
          )) {
            if ($text.Contains($forbidden)) {
              throw "Combinatoria consolidata contiene logica superata: $forbidden"
            }
          }
          Write-Host "FUNZIONI_DIEGO_FINAL_CLOSURE_MATRIX_OK"

          foreach ($marker in @(
            "TermodelLog.LogCategory.SpiraliDiego",
            "LogChiusura(",
            '"Closure.Try"',
            '"Closure.Reject"',
            '"Closure.Accept"',
            '"Closure.AttemptReport"',
            '"Closure.Selected"',
            '"Closure.Summary"',
            "outcome={esito}",
            '"SUCCESS"',
            '"FAILURE"'
          )) {
            if (-not $text.Contains($marker)) {
              throw "Log istituzionale combinatoria privo del marker: $marker"
            }
          }
          foreach ($forbiddenLog in @(
            "TERMODEL_DIEGO_VITTORIO_TRACE_CLOSURE",
            "DV_SQUARE_TRY",
            "DV_CLOSURE_SELECTED"
          )) {
            if ($text.Contains($forbiddenLog)) {
              throw "Diagnostica privata obsoleta rimasta in funzioni_diego: $forbiddenLog"
            }
          }
          Write-Host "FUNZIONI_DIEGO_INSTITUTIONAL_CLOSURE_LOG_OK"

          $legacyPath = "src/Termodel.Core/CopiedFromTermodel/SpiraliDiegoVittorio/ChiudiSpirale.cs"
          $legacyText = Get-Content -LiteralPath $legacyPath -Raw
          foreach ($forbidden in @(
            "GeneraPrimaChiusuraAccettabile",
            "CreaConfigurazioneTerminaleProiettata",
            "preferisciTerminaleP"
          )) {
            if ($legacyText.Contains($forbidden)) {
              throw "Duplicazione combinatoria rimasta in ChiudiSpirale: $forbidden"
            }
          }
          Write-Host "FUNZIONI_DIEGO_SINGLE_CLOSURE_AUTHORITY_OK"

      - name: Harness quadrato Vittorio_revisionato public closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RevisionatoPublicSquareClosure"
          $id = "REVISIONATO-PUBLIC-SQUARE-CLOSURE"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030-VITTORIO-REVISIONATO.json `
            --engine Vittorio_revisionato `
            --revisionato-public `
            --log-enabled true `
            --log-categories SpiraliDiego `
            --id $id `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Harness quadrato pubblico revisionato fallito." }
          $log = Join-Path $out "$id.log.txt"
          $svg = Join-Path $out "$id.svg"
          if (-not (Test-Path $log) -or -not (Test-Path $svg)) { throw "Artifact quadrato pubblico mancanti." }
          $logText = Get-Content $log -Raw
          if ($logText -notmatch '\[SpiraliDiego\]\[Closure\.Try\][^\r\n]*attempt=1[^\r\n]*seq=M0I/R0I') {
            Get-Content $log | Write-Host
            throw "Quadrato pubblico: la combinatoria non parte da M0I/R0I."
          }
          if ($logText -match '\[SpiraliDiego\]\[Closure\.Try\][^\r\n]*seq=[^\r\n]*RP') {
            Get-Content $log | Write-Host
            throw "Quadrato pubblico: ricomparsa una variante RP non prevista dalla combinatoria finale."
          }

          $failureReport = Get-Content $log | Where-Object {
            $_ -match '\[SpiraliDiego\]\[Closure\.AttemptReport\]' -and
            $_ -match 'outcome=FAILURE'
          } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($failureReport)) {
            Get-Content $log | Write-Host
            throw "Quadrato pubblico: manca un report FAILURE di una permutazione scartata."
          }
          foreach ($marker in @(
            "attempt=",
            "seq=",
            "reason=",
            "supplyRemoved=",
            "supplyMode=",
            "supplyLast=",
            "supplyLastLen=",
            "returnRemoved=",
            "returnMode=",
            "returnLast=",
            "returnLastLen=",
            "closureLength=",
            "required="
          )) {
            if (-not $failureReport.Contains($marker)) {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: report FAILURE incompleto, manca $marker"
            }
          }

          $applied = $logText -match 'Chiusura Diego combinatoria: APPLICATA'
          $open = $logText -match 'Chiusura Diego combinatoria: NON APPLICATA'
          if (-not $applied -and -not $open) {
            Get-Content $log | Write-Host
            throw "Quadrato pubblico: esito combinatoria LG-051 non riconoscibile."
          }

          if ($applied) {
            $successReport = Get-Content $log | Where-Object {
              $_ -match '\[SpiraliDiego\]\[Closure\.AttemptReport\]' -and
              $_ -match 'outcome=SUCCESS'
            } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($successReport)) {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: manca il report SUCCESS della permutazione selezionata."
            }
            foreach ($marker in @(
              "attempt=",
              "seq=",
              "reason=accepted",
              "supplyRemoved=",
              "supplyMode=",
              "supplyLast=",
              "supplyLastLen=",
              "returnRemoved=",
              "returnMode=",
              "returnLast=",
              "returnLastLen=",
              "closureLength=",
              "required=",
              "cosSupply=",
              "cosReturn=",
              "intersectsSupply=False",
              "intersectsReturn=False"
            )) {
              if (-not $successReport.Contains($marker)) {
                Get-Content $log | Write-Host
                throw "Quadrato pubblico: report SUCCESS incompleto, manca $marker"
              }
            }
            if ($logText -notmatch '\[SpiraliDiego\]\[Closure\.Summary\][^\r\n]*outcome=SUCCESS[^\r\n]*attempts=[0-9]+[^\r\n]*selected=M[0-2][IP]/R[0-2][IP]') {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: summary SUCCESS della combinatoria non trovato."
            }

            $selected = [regex]::Match(
              $logText,
              '\[SpiraliDiego\]\[Closure\.Selected\][^\r\n]*type=first-straight-success[^\r\n]*length=([0-9]+(?:\.[0-9]+)?(?:[Ee][+-]?[0-9]+)?)[^\r\n]*requiredLength=([0-9]+(?:\.[0-9]+)?(?:[Ee][+-]?[0-9]+)?)')
            if (-not $selected.Success) {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: chiusura applicata senza selezione rettilinea LG-051."
            }

            $straightLength = [double]::Parse(
              $selected.Groups[1].Value,
              [Globalization.CultureInfo]::InvariantCulture)
            $requiredLength = [double]::Parse(
              $selected.Groups[2].Value,
              [Globalization.CultureInfo]::InvariantCulture)
            if ($straightLength + 1e-6 -lt $requiredLength) {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: chiusura rettilinea troppo corta: $straightLength < $requiredLength."
            }
            if ($logText -notmatch 'VREV_LG051_CLOSURE_OK') {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: post-processo LG-051 non confermato."
            }

            Write-Host "REVISIONATO_PUBLIC_SQUARE_STRAIGHT_2P_OK length=$straightLength required=$requiredLength"
          }
          else {
            if ($logText -notmatch '\[SpiraliDiego\]\[Closure\.Summary\][^\r\n]*outcome=FAILURE[^\r\n]*selected=none') {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: summary FAILURE della combinatoria non trovato."
            }
            if ($logText -match '\[SpiraliDiego\]\[Closure\.Selected\][^\r\n]*type=first-straight-success' -or
                $logText -match 'VREV_LG051_CLOSURE_OK') {
              Get-Content $log | Write-Host
              throw "Quadrato pubblico: circuito dichiarato aperto ma risulta una chiusura selezionata."
            }
            Write-Host "REVISIONATO_PUBLIC_SQUARE_OPEN_LG051_OK"
          }

          Write-Host "REVISIONATO_PUBLIC_SQUARE_LG051_OK"
          Write-Host "SVG=$svg"

      - name: Verify Vittorio_revisionato initial equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "VittorioRevisionatoEquivalence"
          $vOut = Join-Path $root "vittorio"
          $rOut = Join-Path $root "revisionato"

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.json `
            --engine Vittorio `
            --id VITTORIO-SQUARE-BASELINE `
            --out $vOut
          if ($LASTEXITCODE -ne 0) { throw "Vittorio baseline quadrato fallita." }

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030-VITTORIO-REVISIONATO.json `
            --engine Vittorio_revisionato `
            --id VITTORIO-REVISIONATO-SQUARE `
            --out $rOut
          if ($LASTEXITCODE -ne 0) { throw "Vittorio_revisionato quadrato fallita." }

          $vSvg = Join-Path $vOut "VITTORIO-SQUARE-BASELINE.svg"
          $rSvg = Join-Path $rOut "VITTORIO-REVISIONATO-SQUARE.svg"
          $vXml = Join-Path $vOut "VITTORIO-SQUARE-BASELINE.result.locale.xml"
          $rXml = Join-Path $rOut "VITTORIO-REVISIONATO-SQUARE.result.locale.xml"
          foreach ($p in @($vSvg,$rSvg,$vXml,$rXml)) {
            if (-not (Test-Path -LiteralPath $p)) { throw "Artifact equivalenza mancante: $p" }
          }

          $vSvgHash = (Get-FileHash -LiteralPath $vSvg -Algorithm SHA256).Hash
          $rSvgHash = (Get-FileHash -LiteralPath $rSvg -Algorithm SHA256).Hash
          $vXmlHash = (Get-FileHash -LiteralPath $vXml -Algorithm SHA256).Hash
          $rXmlHash = (Get-FileHash -LiteralPath $rXml -Algorithm SHA256).Hash

          if ($vSvgHash -ne $rSvgHash) {
            throw "Equivalenza SVG fallita: Vittorio=$vSvgHash Revisionato=$rSvgHash"
          }
          if ($vXmlHash -ne $rXmlHash) {
            throw "Equivalenza XML fallita: Vittorio=$vXmlHash Revisionato=$rXmlHash"
          }

          Write-Host "VITTORIO_REVISIONATO_INITIAL_EQUIVALENCE_OK"
          Write-Host "SVG_SHA256=$vSvgHash"
          Write-Host "XML_SHA256=$vXmlHash"

      - name: Verify Vittorio_revisionato multi-project equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "VittorioRevisionatoMultiProject"
          ./tools/local-radiant-harness/Test-VittorioRevisionatoEquivalence.ps1 -Configuration Release -OutputRoot $root
          if ($LASTEXITCODE -ne 0) { throw "Equivalenza multi-progetto Vittorio_revisionato fallita." }
          $report = Join-Path $root "equivalence-report.json"
          if (-not (Test-Path -LiteralPath $report)) { throw "Report equivalenza multi-progetto mancante." }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $data.allEquivalent -or $data.caseCount -lt 6) {
            throw "Report equivalenza multi-progetto non valido."
          }
          Write-Host "VITTORIO_REVISIONATO_MULTI_PROJECT_WORKFLOW_OK cases=$($data.caseCount)"

      - name: Verify Vittorio_revisionato pure Vittorio generator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $check = dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- revisionato-check 2>&1
          $check | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Check Generate Vittorio puro fallito." }
          $checkText = $check -join [Environment]::NewLine
          if (-not $checkText.Contains("VITTORIO_REVISIONATO_PURE_GENERATOR_OK")) {
            throw "Marker Generate Vittorio puro mancante."
          }
          if (-not $checkText.Contains("equivalentToVittorio=true")) {
            throw "Il Generate revisionato non risulta equivalente a Vittorio."
          }
          Write-Host "VITTORIO_REVISIONATO_PURE_GENERATOR_WORKFLOW_OK"

      - name: Inspect Supply only on public cases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $input = "tests/radiant-harness/prepared/PannelliRadiantiPublic.pannelli.xml"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioSupplyOnly"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Controllo quadrato pubblico approvato: stessa pipeline Supply, senza Return/LG-048.
          $squareOut = Join-Path $root "public-square"
          $squareId = "DV-SUPPLY-PUBLIC-SQUARE"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json `
            --id $squareId `
            --supply-only `
            --out $squareOut
          if ($LASTEXITCODE -ne 0) { throw "Supply-only quadrato pubblico fallito." }
          $squareLog = Join-Path $squareOut "$squareId.log.txt"
          Write-Host "=== SUPPLY_ONLY public-square ==="
          Get-Content -LiteralPath $squareLog | Where-Object { $_ -match 'DV_SUPPLY_' } | Write-Host

          foreach ($locale in @("locale_1","locale_2","locale_5","locale_6","locale_8","locale_9")) {
            $safe = $locale.Replace("_","-")
            $caseId = "DV-SUPPLY-$safe"
            $out = Join-Path $root $locale
            dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
              --input $input `
              --locale $locale `
              --engine Diego_Vittorio `
              --id $caseId `
              --p 0.30 `
              --supply-only `
              --out $out
            if ($LASTEXITCODE -ne 0) { throw "Supply-only $locale fallito." }

            $log = Join-Path $out "$caseId.log.txt"
            $metricsPath = Join-Path $out "$caseId.metrics.json"
            if (-not (Test-Path -LiteralPath $log) -or -not (Test-Path -LiteralPath $metricsPath)) {
              throw "Artifact Supply-only mancante per $locale."
            }
            $metrics = Get-Content -LiteralPath $metricsPath -Raw | ConvertFrom-Json
            Write-Host "=== SUPPLY_ONLY $locale ==="
            Get-Content -LiteralPath $log | Where-Object { $_ -match 'DV_SUPPLY_' } | Write-Host
            Write-Host ("SUPPLY_ONLY_RESULT locale={0} points={1} svg={2}" -f $locale,$metrics.SpiralPointCount,$metrics.svgSha256)
          }
          Write-Host "DIEGO_VITTORIO_SUPPLY_ONLY_MATRIX_OK"

      - name: Inspect categorized Supply log locale_1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $input = "tests/radiant-harness/prepared/PannelliRadiantiPublic.pannelli.xml"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioLocale1CategorizedLog"
          $caseId = "DV-LOCALE1-CATEGORIZED-LOG"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --input $input `
            --locale locale_1 `
            --engine Diego_Vittorio `
            --id $caseId `
            --p 0.30 `
            --supply-only `
            --log-enabled true `
            --log-categories SpiraliDiegoVittorio `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Harness categorizzato locale_1 fallito." }

          $log = Join-Path $out "$caseId.log.txt"
          if (-not (Test-Path -LiteralPath $log)) { throw "Log categorizzato locale_1 mancante." }
          $content = Get-Content -LiteralPath $log -Raw
          foreach ($marker in @(
            "[SpiraliDiegoVittorio][Supply.Context]",
            "[SpiraliDiegoVittorio][Supply.Access.Context]",
            "[SpiraliDiegoVittorio][Supply.Access.Connection]",
            "accessDistanceInside=",
            "[SpiraliDiegoVittorio][Supply.Access.Finalize]",
            "[SpiraliDiegoVittorio][Supply.Offset.Begin]",
            "[SpiraliDiegoVittorio][Supply.ComputeOffset.Edge] level=3 edge=1",
            "conditionShort=true conditionShrink=true skip=true",
            "[SpiraliDiegoVittorio][Supply.ComputeOffset.Result] level=3",
            "skippedVertices=[0,1,2,3]",
            "[SpiraliDiegoVittorio][Supply.ComputeOffset.Raw] level=3",
            "[SpiraliDiegoVittorio][Supply.Offset.Stop] level=3 reason=invalid-offset",
            "[SpiraliDiegoVittorio][Supply.Traverse.Connection] offset=2",
            "[SpiraliDiegoVittorio][Supply.Traverse.Candidate] offset=2",
            "[SpiraliDiegoVittorio][Supply.Finalize.Result] offset=2",
            "[SpiraliDiegoVittorio][Supply.Traverse.End] offset=2"
          )) {
            if (-not $content.Contains($marker)) {
              throw "Log categorizzato locale_1 privo del marker: $marker"
            }
          }

          Write-Host "=== LOCALE_1 CATEGORIZED SUPPLY LOG ==="
          Get-Content -LiteralPath $log | Where-Object { $_ -match '\[SpiraliDiegoVittorio\]' } | Write-Host
          Write-Host "DIEGO_VITTORIO_LOCALE1_CATEGORY_LOG_OK"

      - name: Run Diego_Vittorio square
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioFast"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Harness Diego_Vittorio fallito." }
          $svg = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.svg"
          $log = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.log.txt"
          $metrics = Join-Path $out "LG041-SQUARE4X4-T1-P030-DIEGO-VITTORIO.metrics.json"
          foreach ($required in @($svg,$log,$metrics)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Artifact fast mancante: $required" }
          }
          tools/local-radiant-harness/Test-DiegoVittorioDistances.ps1 -SvgPath $svg -StepMeters 0.30
          Write-Host "DIEGO_VITTORIO_FAST_SQUARE_OK"

      - name: Run public square left inlet regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPublicSquare"
          $caseId = "DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json `
            --log-enabled true `
            --log-categories SpiraliDiego `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression quadrato pubblico Diego_Vittorio fallita." }

          $svg = Join-Path $out "$caseId.svg"
          $log = Join-Path $out "$caseId.log.txt"
          $metrics = Join-Path $out "$caseId.metrics.json"
          foreach ($required in @($svg,$log,$metrics)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Artifact regression mancante: $required" }
          }

          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -match 'Ritorno: offset 2 senza tratto percorribile') {
            throw "Regressione DV-TEST-001: offset 2 nuovamente bloccato."
          }
          if ($logText -match 'Ritorno: offset 3 senza collegamento valido') {
            throw "Regressione DV-TEST-001: offset 3 nuovamente bloccato."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=17') {
            throw "Regressione DV-TEST-001: Return non raggiunge i 17 punti attesi."
          }
          if ($logText -notmatch '\[SpiraliDiego\]\[Closure\.Result\][^\r\n]*attempt=') {
            throw "Regressione DV-TEST-001: esito chiusura nel log istituzionale SpiraliDiego non trovato."
          }

          $baselinePath = "tests/radiant-harness/baselines/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json"
          $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
          $actualSvgHash = (Get-FileHash -LiteralPath $svg -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSvgHash = ([string]$baseline.svgSha256).ToLowerInvariant()
          if ($actualSvgHash -ne $expectedSvgHash) {
            throw "VINCOLO QUADRATO BASE VIOLATO: SVG $actualSvgHash, atteso $expectedSvgHash."
          }
          $metricsObject = Get-Content -LiteralPath $metrics -Raw | ConvertFrom-Json
          if ([int]$metricsObject.SpiralPointCount -ne [int]$baseline.spiralPointCount) {
            throw "VINCOLO QUADRATO BASE VIOLATO: punti=$($metricsObject.SpiralPointCount), attesi=$($baseline.spiralPointCount)."
          }
          Write-Host "DIEGO_VITTORIO_APPROVED_SQUARE_BASELINE_OK"

          # Test-DiegoVittorioDistances.ps1 resta volutamente specifico del
          # quadrato sintetico 0..4 e viene già eseguito nello step precedente.
          # Questa regression verifica il difetto DV-TEST-001 sul vero input
          # pubblico, il completamento del Return e la chiusura.
          Write-Host "DIEGO_VITTORIO_PUBLIC_SQUARE_LEFT_OK"

      - name: Generate locale_1 pre-closure SVG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPanelsLocale1PreClosure"
          $caseId = "DV-LOCALE1-T6-PRECLOSE"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/DV-PUBLIC-PANELS-RECT-01-P030-DIEGO-VITTORIO.json `
            --id $caseId `
            --skip-close `
            --log-enabled true `
            --log-categories SpiraliDiegoVittorio `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Generazione SVG pre-chiusura locale_1 fallita." }

          $svg = Join-Path $out "$caseId.svg"
          $log = Join-Path $out "$caseId.log.txt"
          $metrics = Join-Path $out "$caseId.metrics.json"
          foreach ($required in @($svg,$log,$metrics)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Artifact pre-chiusura mancante: $required"
            }
          }

          $svgText = Get-Content -LiteralPath $svg -Raw
          $logText = Get-Content -LiteralPath $log -Raw
          $metricsObject = Get-Content -LiteralPath $metrics -Raw | ConvertFrom-Json
          if ($svgText -notmatch 'data-termodel-closure="disabled"') {
            throw "SVG pre-chiusura non dichiara closure=disabled."
          }
          if ($logText -notmatch 'Chiusura SVG Diego_Vittorio: DISATTIVATA') {
            throw "Log pre-chiusura non conferma la chiusura disattivata."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=18') {
            throw "Il Return autonomo locale_1 non è stato mantenuto."
          }
          if ([string]$metricsObject.mode -ne "pre-close") {
            throw "Modalità metrics inattesa: $($metricsObject.mode)"
          }
          Write-Host "DIEGO_VITTORIO_LOCALE1_PRECLOSE_SVG_OK"
          Write-Host "PRECLOSE_SVG=$svg"

      - name: Trace Return bottleneck locale_1 vs public square
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TERMODEL_DIEGO_VITTORIO_TRACE_RETURN = "true"
          $env:TERMODEL_DIEGO_VITTORIO_TRACE_PORTALS = "true"
          $root = Join-Path $env:RUNNER_TEMP "DiegoVittorioReturnBottleneckTrace"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $cases = @(
            @{
              Name = "locale1"
              Case = "tests/radiant-harness/cases/DV-PUBLIC-PANELS-RECT-01-P030-DIEGO-VITTORIO.json"
              Id = "DV-TRACE-LOCALE1-T6"
            },
            @{
              Name = "square"
              Case = "tests/radiant-harness/cases/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json"
              Id = "DV-TRACE-PUBLIC-SQUARE"
            }
          )

          foreach ($item in $cases) {
            $out = Join-Path $root $item.Name
            dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
              --case $item.Case `
              --id $item.Id `
              --skip-close `
              --out $out
            if ($LASTEXITCODE -ne 0) { throw "Return trace $($item.Name) fallito." }

            $log = Join-Path $out "$($item.Id).log.txt"
            if (-not (Test-Path -LiteralPath $log)) { throw "Return trace log mancante: $log" }
            Write-Host "=== RETURN TRACE $($item.Name) ==="
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match 'DV_RETURN_|Ritorno: offset|Ritorno autonomo|Ritorno parametrico'
            } | Write-Host
          }

          Remove-Item Env:TERMODEL_DIEGO_VITTORIO_TRACE_RETURN -ErrorAction SilentlyContinue
          Remove-Item Env:TERMODEL_DIEGO_VITTORIO_TRACE_PORTALS -ErrorAction SilentlyContinue
          Write-Host "DIEGO_VITTORIO_RETURN_BOTTLENECK_TRACE_OK"

      - name: Run Vittorio reference locale_1 vs public square
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "VittorioReferenceComparison"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $cases = @(
            @{
              Name = "locale1"
              Case = "tests/radiant-harness/cases/DV-PUBLIC-PANELS-RECT-01-P030-DIEGO-VITTORIO.json"
              Id = "VITTORIO-LOCALE1-T6"
            },
            @{
              Name = "square"
              Case = "tests/radiant-harness/cases/DV-PUBLIC-SQUARE-LEFT-P030-DIEGO-VITTORIO.json"
              Id = "VITTORIO-PUBLIC-SQUARE"
            }
          )

          foreach ($item in $cases) {
            $out = Join-Path $root $item.Name
            dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
              --case $item.Case `
              --engine Vittorio `
              --id $item.Id `
              --out $out
            if ($LASTEXITCODE -ne 0) { throw "Vittorio reference $($item.Name) fallito." }
            $metrics = Join-Path $out "$($item.Id).metrics.json"
            if (-not (Test-Path -LiteralPath $metrics)) { throw "Vittorio metrics mancanti: $metrics" }
            $m = Get-Content -LiteralPath $metrics -Raw | ConvertFrom-Json
            Write-Host ("VITTORIO_REFERENCE name={0} points={1} svg={2}" -f $item.Name,$m.SpiralPointCount,$m.svgSha256)
          }
          Write-Host "VITTORIO_REFERENCE_COMPARISON_OK"

      - name: Run public panels locale_1 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPanelsLocale1"
          $caseId = "DV-PUBLIC-PANELS-RECT-01-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/$caseId.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression locale_1 fallita." }

          $log = Join-Path $out "$caseId.log.txt"
          if (-not (Test-Path -LiteralPath $log)) { throw "Log locale_1 mancante." }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -match 'Ritorno: offset 2 senza collegamento valido' -or
              $logText -match 'Ritorno: offset 3 senza collegamento valido') {
            throw "Regressione locale_1: Return nuovamente intrappolato."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=18') {
            throw "Regressione locale_1: Return non raggiunge 18 punti."
          }
          if ($logText -notmatch 'Chiusura rapida:.*sequenza=M4/RP3.*lunghezza=0.6 m') {
            throw "Regressione locale_1: chiusura proiettata M4/RP3 non presente."
          }
          Write-Host "DIEGO_VITTORIO_PUBLIC_PANELS_LOCALE1_OK"

      - name: Run public panels locale_5 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPanelsLocale5"
          $caseId = "DV-PUBLIC-PANELS-RECT-05-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/$caseId.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression locale_5 fallita." }

          $log = Join-Path $out "$caseId.log.txt"
          if (-not (Test-Path -LiteralPath $log)) { throw "Log locale_5 mancante." }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -notmatch 'Ritorno autonomo:.*punti=16') {
            throw "Regressione locale_5: Return non raggiunge 16 punti."
          }
          if ($logText -notmatch 'Chiusura rapida:.*sequenza=M2/RP3.*tipo=ortogonale.*lunghezza=1.24 m') {
            throw "Regressione locale_5: chiusura ortogonale minima M2/RP3 da 1,24 m non selezionata."
          }
          Write-Host "DIEGO_VITTORIO_PUBLIC_PANELS_LOCALE5_OK"

      - name: Run public panels locale_8 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPanelsLocale8"
          $caseId = "DV-PUBLIC-PANELS-RECT-08-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/$caseId.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression locale_8 fallita." }

          $log = Join-Path $out "$caseId.log.txt"
          if (-not (Test-Path -LiteralPath $log)) { throw "Log locale_8 mancante." }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -match 'Ritorno: offset 2 senza collegamento valido' -or
              $logText -match 'Ritorno: offset 3 senza collegamento valido') {
            throw "Regressione locale_8: Return nuovamente bloccato."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=18') {
            throw "Regressione locale_8: Return non raggiunge 18 punti."
          }
          if ($logText -notmatch 'Chiusura rapida: tentativo=.*lunghezza=0.971 m') {
            throw "Regressione locale_8: chiusura attesa non presente."
          }
          Write-Host "DIEGO_VITTORIO_PUBLIC_PANELS_LOCALE8_OK"

      - name: Run public panels locale_9 regression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "DiegoVittorioPanelsLocale9"
          $caseId = "DV-PUBLIC-PANELS-RECT-09-P030-DIEGO-VITTORIO"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/$caseId.json `
            --out $out
          if ($LASTEXITCODE -ne 0) { throw "Regression locale_9 fallita." }

          $log = Join-Path $out "$caseId.log.txt"
          if (-not (Test-Path -LiteralPath $log)) { throw "Log locale_9 mancante." }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -match 'Ritorno: offset 2 senza collegamento valido') {
            throw "Regressione locale_9: Return nuovamente bloccato."
          }
          if ($logText -notmatch 'Ritorno autonomo:.*punti=13') {
            throw "Regressione locale_9: Return non raggiunge 13 punti."
          }
          if ($logText -notmatch 'Chiusura rapida:.*sequenza=M3/RP2.*tipo=ortogonale.*lunghezza=0.77 m') {
            throw "Regressione locale_9: chiusura M3/RP2 ortogonale da 0,77 m non presente."
          }
          Write-Host "DIEGO_VITTORIO_PUBLIC_PANELS_LOCALE9_OK"

      - name: Run fitting regression
        run: dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- fillet-check

      - name: Upload fast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diego-vittorio-fast
          path: |
            ${{ runner.temp }}/RevisionatoPublicSquareClosure
            ${{ runner.temp }}/VittorioRevisionatoEquivalence
            ${{ runner.temp }}/VittorioRevisionatoMultiProject
            ${{ runner.temp }}/DiegoVittorioFast
            ${{ runner.temp }}/DiegoVittorioSupplyOnly
            ${{ runner.temp }}/DiegoVittorioLocale1CategorizedLog
            ${{ runner.temp }}/DiegoVittorioPublicSquare
            ${{ runner.temp }}/DiegoVittorioPanelsLocale1
            ${{ runner.temp }}/DiegoVittorioPanelsLocale1PreClosure
            ${{ runner.temp }}/DiegoVittorioReturnBottleneckTrace
            ${{ runner.temp }}/VittorioReferenceComparison
            ${{ runner.temp }}/DiegoVittorioPanelsLocale5
            ${{ runner.temp }}/DiegoVittorioPanelsLocale8
            ${{ runner.temp }}/DiegoVittorioPanelsLocale9
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final status
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jobStatus = "${{ job.status }}"
          $ok = $jobStatus -eq "success"
          $state = if ($ok) { "success" } else { "failure" }
          $label = if ($ok) { "SUCCESS" } else { "FAILED" }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "Termodel/job"
            description = "$label - Diego_Vittorio Fast #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
