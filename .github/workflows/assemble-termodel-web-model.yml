name: Assemble Termodel Web test model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-termodel-web-model.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble uploaded JSON
        shell: bash
        run: |
          cat SorgentiTermodel/Work/Web/.TermodelWebModel.part1.b64 \
              SorgentiTermodel/Work/Web/.TermodelWebModel.part2.b64 > /tmp/TermodelWebModel.b64
          base64 --decode /tmp/TermodelWebModel.b64 > /tmp/TermodelWebModel.json.gz
          gzip -dc /tmp/TermodelWebModel.json.gz > SorgentiTermodel/Work/Web/TermodelWebModel.json
          python - <<'PY'
          import json
          p='SorgentiTermodel/Work/Web/TermodelWebModel.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('format') == 'TermodelWebModel'
          assert d.get('primitiveCount') == len(d.get('primitives', [])) == 546
          print('OK:', d['format'], d['version'], d['primitiveCount'])
          PY
          rm SorgentiTermodel/Work/Web/.TermodelWebModel.part1.b64
          rm SorgentiTermodel/Work/Web/.TermodelWebModel.part2.b64
          rm .github/workflows/assemble-termodel-web-model.yml

      - name: Commit model
        shell: bash
        run: |
          git config user.name "Fetonte1960"
          git config user.email "diegoquattrone2@hotmail.com"
          git add -A
          git commit -m "Add Termodel Web test model"
          git push
