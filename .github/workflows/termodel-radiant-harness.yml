name: Termodel Radiant Harness

permissions:
  contents: read
  statuses: write

concurrency:
  group: termodel-radiant-harness-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'Server/Termodelwebservice/src/Termodel.Core/RadiantPanels/**'
      - 'Server/Termodelwebservice/tools/Termodel.RadiantPanels.Harness/**'
      - 'Server/Termodelwebservice/tests/radiant-harness/**'
      - 'Server/Termodelwebservice/tests/fixtures/StrategiaDiego*.locale.xml'
      - '.github/workflows/termodel-radiant-harness.yml'
  pull_request:
    paths:
      - 'Server/Termodelwebservice/src/Termodel.Core/RadiantPanels/**'
      - 'Server/Termodelwebservice/tools/Termodel.RadiantPanels.Harness/**'
      - 'Server/Termodelwebservice/tests/radiant-harness/**'
      - 'Server/Termodelwebservice/tests/fixtures/StrategiaDiego*.locale.xml'
      - '.github/workflows/termodel-radiant-harness.yml'

jobs:
  harness:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server/Termodelwebservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Termodel job RUNNING
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = "pending"
            context = "Termodel/job"
            description = "RUNNING - Radiant Harness #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          Write-Host "TERMODEL_JOB_STATUS=RUNNING"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Core + Harness only
        run: dotnet restore tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj

      - name: Build Core + Harness only
        run: dotnet build tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-restore

      - name: Run current fast case
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --out $out
          if (-not (Test-Path (Join-Path $out "LG041-SQUARE4X4-T1-P030.svg"))) { throw "SVG Harness mancante." }
          if (-not (Test-Path (Join-Path $out "LG041-SQUARE4X4-T1-P030.log.txt"))) { throw "Log Harness mancante." }
          if (-not (Test-Path (Join-Path $out "LG041-SQUARE4X4-T1-P030.metrics.json"))) { throw "Metriche Harness mancanti." }
          Write-Host "RADIANT_HARNESS_FAST_CASE_OK"

      - name: Run supply solution explorer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --out $out `
            --supply-top 40
          $dir = Join-Path $out "LG041-SQUARE4X4-T1-P030.supply-explorer"
          if (-not (Test-Path (Join-Path $dir "solutions.json"))) { throw "Solution Explorer manifest mancante." }
          if (-not (Test-Path (Join-Path $dir "index.html"))) { throw "Solution Explorer index mancante." }
          if (-not (Test-Path (Join-Path $dir "supply-rank-001.svg"))) { throw "Solution Explorer rank 1 mancante." }
          if (-not (Test-Path (Join-Path $dir "supply-rank-040.svg"))) { throw "Solution Explorer rank 20 mancante." }
          Write-Host "RADIANT_HARNESS_SUPPLY_EXPLORER_TOP40_OK"
      - name: Run Decision Reject Replay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          $baseline = Get-Content -LiteralPath (Join-Path $out "LG041-SQUARE4X4-T1-P030.supply-explorer\solutions.json") -Raw | ConvertFrom-Json
          if ($baseline.solutions.Count -lt 2) { throw "Servono almeno due setup Supply per il replay." }
          $expectedNextKey = $baseline.solutions[1].terminalDecisionKey
          if ([string]::IsNullOrWhiteSpace($expectedNextKey)) { throw "Decision Key rank 2 mancante." }
          if ($baseline.solutions.Count -lt 3) { throw "Servono almeno tre setup Supply per il replay cumulativo." }
          $expectedThirdKey = $baseline.solutions[2].terminalDecisionKey
          if ([string]::IsNullOrWhiteSpace($expectedThirdKey)) { throw "Decision Key rank 3 mancante." }

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-REPLAY-NEXT `
            --out $out `
            --reject-current-supply

          $svg = Join-Path $out "LG041-REPLAY-NEXT.svg"
          $log = Join-Path $out "LG041-REPLAY-NEXT.log.txt"
          $replay = Join-Path $out "LG041-REPLAY-NEXT.decision-replay.json"
          $rejects = Join-Path $out "LG041-REPLAY-NEXT.reject-decisions.txt"
          $nextSupplySvg = Join-Path $out "LG041-REPLAY-NEXT.next-supply.svg"
          foreach ($required in @($svg,$log,$replay,$rejects,$nextSupplySvg)) {
            if (-not (Test-Path $required)) { throw "Decision Replay artifact mancante: $required" }
          }

          $replayData = Get-Content -LiteralPath $replay -Raw | ConvertFrom-Json
          if ($replayData.rejectedDecisionCount -ne 1) { throw "Decision Replay: numero reject inatteso." }
          if ($replayData.nextSetup.TerminalDecisionKey -ne $expectedNextKey) {
            throw "Decision Replay non ha restituito il setup immediatamente successivo della classifica Supply."
          }
          if ($replayData.nextSetup.Goodness -gt ($replayData.rejectedSetup.Goodness + 0.0000001)) {
            throw "Decision Replay: il setup successivo risulta piu' performante del setup scartato."
          }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -notmatch "DIEGO_DECISION_REPLAY REJECT_BY_INPUT") { throw "REJECT_BY_INPUT non registrato nel log." }
          if ($logText -notmatch "PRUNED_BY_REPLAY") { throw "PRUNED_BY_REPLAY non registrato nel log." }

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-REPLAY-FILE `
            --out $out `
            --reject-decisions $rejects

          $fileSvg = Join-Path $out "LG041-REPLAY-FILE.svg"
          $fileLog = Join-Path $out "LG041-REPLAY-FILE.log.txt"
          if (-not (Test-Path $fileSvg)) { throw "Replay da file: SVG mancante." }
          if (-not (Test-Path $fileLog)) { throw "Replay da file: log mancante." }
          $hashDirect = (Get-FileHash -LiteralPath $svg -Algorithm SHA256).Hash
          $hashFile = (Get-FileHash -LiteralPath $fileSvg -Algorithm SHA256).Hash
          if ($hashDirect -ne $hashFile) { throw "Replay da file non riproduce lo stesso SVG del reject corrente." }
          if ((Get-Content -LiteralPath $fileLog -Raw) -notmatch "DIEGO_DECISION_REPLAY REJECT_BY_INPUT") {
            throw "Replay da file: REJECT_BY_INPUT non registrato."
          }

          # Secondo rifiuto cumulativo: riusa il reject del rank 1,
          # scarta il setup corrente (che deve essere il vecchio rank 2)
          # e verifica che emerga esattamente il vecchio rank 3.
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-REPLAY-NEXT2 `
            --out $out `
            --reject-decisions $rejects `
            --reject-current-supply

          $svg2 = Join-Path $out "LG041-REPLAY-NEXT2.svg"
          $log2 = Join-Path $out "LG041-REPLAY-NEXT2.log.txt"
          $replay2 = Join-Path $out "LG041-REPLAY-NEXT2.decision-replay.json"
          $rejects2 = Join-Path $out "LG041-REPLAY-NEXT2.reject-decisions.txt"
          foreach ($required in @($svg2,$log2,$replay2,$rejects2)) {
            if (-not (Test-Path $required)) { throw "Decision Replay cumulativo artifact mancante: $required" }
          }

          $replayData2 = Get-Content -LiteralPath $replay2 -Raw | ConvertFrom-Json
          if ($replayData2.rejectedDecisionCount -ne 2) {
            throw "Decision Replay cumulativo: attesi esattamente due reject."
          }
          if ($replayData2.rejectedSetup.TerminalDecisionKey -ne $expectedNextKey) {
            throw "Decision Replay cumulativo: il secondo setup scartato non coincide col vecchio rank 2."
          }
          if ($replayData2.nextSetup.TerminalDecisionKey -ne $expectedThirdKey) {
            throw "Decision Replay cumulativo non ha restituito il vecchio rank 3."
          }
          $rejectLines = @(Get-Content -LiteralPath $rejects2 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($rejectLines.Count -ne 2 -or (@($rejectLines | Sort-Object -Unique)).Count -ne 2) {
            throw "Decision Replay cumulativo: reject file non contiene due Decision Key distinte."
          }
          $rejectMatches = ([regex]::Matches((Get-Content -LiteralPath $log2 -Raw), "DIEGO_DECISION_REPLAY REJECT_BY_INPUT")).Count
          if ($rejectMatches -lt 2) {
            throw "Decision Replay cumulativo: non sono stati osservati entrambi i rifiuti nel log."
          }

          # Il file cumulativo deve essere autosufficiente e riprodurre
          # byte-per-byte lo SVG ottenuto dal secondo rifiuto interattivo.
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-REPLAY-FILE2 `
            --out $out `
            --reject-decisions $rejects2

          $fileSvg2 = Join-Path $out "LG041-REPLAY-FILE2.svg"
          $fileLog2 = Join-Path $out "LG041-REPLAY-FILE2.log.txt"
          if (-not (Test-Path $fileSvg2)) { throw "Replay cumulativo da file: SVG mancante." }
          if (-not (Test-Path $fileLog2)) { throw "Replay cumulativo da file: log mancante." }
          $hashDirect2 = (Get-FileHash -LiteralPath $svg2 -Algorithm SHA256).Hash
          $hashFile2 = (Get-FileHash -LiteralPath $fileSvg2 -Algorithm SHA256).Hash
          if ($hashDirect2 -ne $hashFile2) {
            throw "Replay cumulativo da file non riproduce lo stesso SVG del secondo reject."
          }
          Write-Host "RADIANT_HARNESS_DECISION_REPLAY_CUMULATIVE_OK"
          Write-Host "RADIANT_HARNESS_DECISION_REPLAY_OK"

      - name: Reject rank1 choice at current node 47
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          $baselinePath = Join-Path $out "LG041-SQUARE4X4-T1-P030.supply-explorer\solutions.json"
          $baseline = Get-Content -LiteralPath $baselinePath -Raw | ConvertFrom-Json
          if ($baseline.solutions.Count -lt 1) { throw "Baseline Supply priva del rank 1." }

          $rank1 = $baseline.solutions[0]
          $nodeIndex = -1
          for ($i = 0; $i -lt $rank1.nodeIds.Count; $i++) {
            if ([int]$rank1.nodeIds[$i] -eq 47) {
              $nodeIndex = $i
              break
            }
          }
          if ($nodeIndex -lt 0) { throw "Nodo 47 non presente nel percorso del rank 1 corrente." }
          if ($nodeIndex -ge $rank1.decisionKeys.Count) {
            throw "Nodo 47 terminale o privo di Decision Key uscente nel rank 1 corrente."
          }

          $node47Key = [string]$rank1.decisionKeys[$nodeIndex]
          if ([string]::IsNullOrWhiteSpace($node47Key)) { throw "Decision Key nodo 47 vuota." }
          if ($node47Key -notmatch "family=Supply") { throw "Decision Key nodo 47 non appartiene alla mandata." }

          $expectedResidual = $null
          foreach ($solution in $baseline.solutions) {
            if (-not (@($solution.decisionKeys) -contains $node47Key)) {
              $expectedResidual = $solution
              break
            }
          }
          if ($null -eq $expectedResidual) {
            throw "Nessuna soluzione residua trovata dopo il reject della scelta al nodo 47."
          }

          $rejectPath = Join-Path $out "LG041-NODE47.reject-decisions.txt"
          Set-Content -LiteralPath $rejectPath -Value $node47Key -Encoding utf8NoBOM

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-NODE47-REJECT `
            --out $out `
            --reject-decisions $rejectPath

          $svg = Join-Path $out "LG041-NODE47-REJECT.svg"
          $log = Join-Path $out "LG041-NODE47-REJECT.log.txt"
          if (-not (Test-Path $svg)) { throw "SVG standard dopo reject nodo 47 mancante." }
          if (-not (Test-Path $log)) { throw "Log dopo reject nodo 47 mancante." }

          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -notlike "*DIEGO_DECISION_REPLAY REJECT_BY_INPUT $node47Key*") {
            throw "La Decision Key del nodo 47 non risulta rifiutata dal vero motore."
          }

          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-NODE47-CHECK `
            --out $out `
            --supply-top 1 `
            --reject-decisions $rejectPath

          $checkPath = Join-Path $out "LG041-NODE47-CHECK.supply-explorer\solutions.json"
          $check = Get-Content -LiteralPath $checkPath -Raw | ConvertFrom-Json
          if ($check.solutions.Count -ne 1) { throw "Explorer residuo nodo 47 non ha restituito un unico top." }
          if ($check.solutions[0].terminalDecisionKey -ne $expectedResidual.terminalDecisionKey) {
            throw "Reject nodo 47: il top residuo non coincide con la prima soluzione baseline priva della Decision Key esclusa."
          }

          $report = [ordered]@{
            rejectedNode = 47
            rejectedDecisionKey = $node47Key
            baselineRank = 1
            residualOriginalRank = [int]$expectedResidual.Rank
            residualTerminalNodeId = [int]$expectedResidual.TerminalNodeId
            residualActiveLengthMeters = [double]$expectedResidual.ActiveLengthMeters
            residualGoodness = [double]$expectedResidual.Goodness
            residualTotalLengthMeters = [double]$expectedResidual.TotalLengthMeters
            svg = $svg
            rejectFile = $rejectPath
          }
          $reportPath = Join-Path $out "LG041-NODE47-REJECT.report.json"
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $reportPath -Encoding utf8NoBOM
          Write-Host "RADIANT_HARNESS_NODE47_REJECT_OK"
          Write-Host ("rejectedDecisionKey=" + $node47Key)
          Write-Host ("residualOriginalRank=" + $expectedResidual.Rank)
      - name: Run supply explorer skip top 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-SKIP20 `
            --out $out `
            --skip-top 20 `
            --supply-top 5
          $dir = Join-Path $out "LG041-SKIP20.supply-explorer"
          if (-not (Test-Path (Join-Path $dir "supply-rank-021.svg"))) { throw "Skip-top rank 21 mancante." }
          if (-not (Test-Path (Join-Path $dir "supply-rank-025.svg"))) { throw "Skip-top rank 25 mancante." }
          if (Test-Path (Join-Path $dir "supply-rank-020.svg")) { throw "Skip-top ha esportato erroneamente rank 20." }
          Write-Host "RADIANT_HARNESS_SUPPLY_EXPLORER_SKIP20_OK"
      - name: Run ranked solution explorer top 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-SOLUTION-TOP3 `
            --out $out `
            --solution-top 3
          $dir = Join-Path $out "LG041-SOLUTION-TOP3.solution-explorer"
          if (-not (Test-Path (Join-Path $dir "solution-rank-001.svg"))) { throw "Solution rank 1 mancante." }
          if (-not (Test-Path (Join-Path $dir "solution-rank-003.svg"))) { throw "Solution rank 3 mancante." }
          if (-not (Test-Path (Join-Path $dir "solutions.json"))) { throw "Solution manifest mancante." }
          if (-not (Test-Path (Join-Path $dir "index.html"))) { throw "Solution index mancante." }
          Write-Host "RADIANT_HARNESS_SOLUTION_TOP3_OK"

      - name: Run ranked solution explorer rank 21
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-SOLUTION-RANK21 `
            --out $out `
            --solution-rank 21
          $dir = Join-Path $out "LG041-SOLUTION-RANK21.solution-explorer"
          if (-not (Test-Path (Join-Path $dir "solution-rank-021.svg"))) { throw "Solution rank 21 mancante." }
          Write-Host "RADIANT_HARNESS_SOLUTION_RANK21_OK"
      - name: Run branch inspector node 63
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/LG041-SQUARE4X4-T1-P030.json `
            --id LG041-BRANCH63 `
            --out $out `
            --inspect-node 63 `
            --compare-node 65
          $dir = Join-Path $out "LG041-BRANCH63.branch-inspector"
          if (-not (Test-Path (Join-Path $dir "branch-node-063.svg"))) { throw "Branch inspector SVG mancante." }
          if (-not (Test-Path (Join-Path $dir "branch-node-063.json"))) { throw "Branch inspector JSON mancante." }
          if (-not (Test-Path (Join-Path $dir "branch-node-063.log.txt"))) { throw "Branch inspector log mancante." }
          $report = Get-Content -LiteralPath (Join-Path $dir "branch-node-063.json") -Raw | ConvertFrom-Json
          if ($report.inspectNode -ne 63) { throw "Branch inspector nodo errato." }
          if ($report.compareNode -ne 65) { throw "Branch inspector compare errato." }
          if ($report.candidates.Count -lt 2) { throw "Branch inspector candidati insufficienti." }
          Write-Host "RADIANT_HARNESS_BRANCH63_OK"
      - name: Run prepared current apartment case
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "RadiantHarness"
          dotnet run --project tools/Termodel.RadiantPanels.Harness/Termodel.RadiantPanels.Harness.csproj -c Release --no-build -- run `
            --case tests/radiant-harness/cases/CURRENT-APARTMENT-P030.json `
            --out $out
          if (-not (Test-Path (Join-Path $out "CURRENT-APARTMENT-P030.svg"))) { throw "SVG appartamento Harness mancante." }
          if (-not (Test-Path (Join-Path $out "CURRENT-APARTMENT-P030.log.txt"))) { throw "Log appartamento Harness mancante." }
          if (-not (Test-Path (Join-Path $out "CURRENT-APARTMENT-P030.metrics.json"))) { throw "Metriche appartamento Harness mancanti." }
          Write-Host "RADIANT_HARNESS_CURRENT_APARTMENT_OK"

      - name: Upload Harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiant-harness-fast
          path: ${{ runner.temp }}/RadiantHarness
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final status and notify
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.TERMODEL_NTFY_TOPIC }}
        run: |
          $jobStatus = "${{ job.status }}"
          $ok = $jobStatus -eq "success"
          $state = if ($ok) { "success" } else { "failure" }
          $label = if ($ok) { "SUCCESS" } else { "FAILED" }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "Termodel/job"
            description = "$label - Radiant Harness #${{ github.run_number }}"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -Method Post -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          Write-Host "TERMODEL_JOB_STATUS=$label"
          if (-not [string]::IsNullOrWhiteSpace($env:NTFY_TOPIC)) {
            try {
              $message = "Termodel Radiant Harness #${{ github.run_number }} $label - ${{ github.sha }} - $runUrl"
              Invoke-RestMethod -Uri "https://ntfy.sh/$env:NTFY_TOPIC" -Method Post -Headers @{
                "Title" = "Termodel Radiant Harness"
                "Priority" = "low"
                "Tags" = if ($ok) { "white_check_mark" } else { "x" }
              } -Body $message | Out-Null
              Write-Host "PHONE_NOTIFICATION_SENT status=$label"
            } catch {
              Write-Warning "Notifica ntfy non riuscita: $($_.Exception.Message)"
            }
          }
